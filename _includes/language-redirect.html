<script>
  (function () {
    var basePath = "{{ site.baseurl | default: '' }}";
    var languagePreferenceKey = "yangyi-wu-site-language";
    var path = window.location.pathname;
    var normalizedPath = path.endsWith("/") ? path : path + "/";
    var languagePairs = {
      "/": "/zh/",
      "/publications/": "/zh/publications/",
      "/talks/": "/zh/talks/",
      "/teaching/": "/zh/teaching/",
      "/cv/": "/zh/cv/"
    };

    function stripBasePath(currentPath) {
      if (basePath && currentPath.indexOf(basePath) === 0) {
        return currentPath.slice(basePath.length) || "/";
      }
      return currentPath;
    }

    function withBasePath(targetPath) {
      if (!basePath || targetPath.indexOf(basePath) === 0) {
        return targetPath;
      }
      return basePath + targetPath;
    }

    function browserPrefersChinese() {
      var languages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || navigator.userLanguage || ""];
      return languages.some(function (language) {
        return /^zh\b/i.test(language);
      });
    }

    function rememberManualChoice(event) {
      var link = event.target.closest("[data-language-option]");
      if (!link) {
        return;
      }
      try {
        localStorage.setItem(languagePreferenceKey, link.dataset.languageOption);
      } catch (error) {
        // Ignore storage failures; navigation should still work.
      }
    }

    function currentLanguagePreference() {
      var params = new URLSearchParams(window.location.search);
      var queryLanguage = params.get("lang");
      if (queryLanguage === "zh" || queryLanguage === "en") {
        try {
          localStorage.setItem(languagePreferenceKey, queryLanguage);
        } catch (error) {
          // Ignore storage failures; the query parameter remains authoritative.
        }
        return queryLanguage;
      }
      try {
        return localStorage.getItem(languagePreferenceKey) || "";
      } catch (error) {
        return "";
      }
    }

    function applyPublicationLanguage() {
      var chosenLanguage = currentLanguagePreference();
      if (chosenLanguage !== "zh" && chosenLanguage !== "en") {
        return;
      }

      document.querySelectorAll("[data-publication-lang]").forEach(function (section) {
        section.hidden = section.dataset.publicationLang !== chosenLanguage;
      });

      document.querySelectorAll("[data-publication-caption]").forEach(function (caption) {
        caption.hidden = caption.dataset.publicationCaption !== chosenLanguage;
      });

      var languageLink = document.querySelector("[data-language-option]");
      if (languageLink && window.location.pathname.indexOf("/publication/") === 0) {
        var nextLanguage = chosenLanguage === "zh" ? "en" : "zh";
        var params = new URLSearchParams(window.location.search);
        params.set("lang", nextLanguage);
        languageLink.dataset.languageOption = nextLanguage;
        languageLink.textContent = nextLanguage === "zh" ? "中文" : "English";
        languageLink.href = window.location.pathname + "?" + params.toString();
      }
    }

    document.addEventListener("click", rememberManualChoice);
    document.addEventListener("DOMContentLoaded", applyPublicationLanguage);

    try {
      if (localStorage.getItem(languagePreferenceKey)) {
        return;
      }
    } catch (error) {
      // Continue with browser-language detection when storage is unavailable.
    }

    var relativePath = stripBasePath(normalizedPath);
    var chineseTarget = languagePairs[relativePath];

    if (browserPrefersChinese() && chineseTarget) {
      window.location.replace(withBasePath(chineseTarget));
    }
  })();
</script>
