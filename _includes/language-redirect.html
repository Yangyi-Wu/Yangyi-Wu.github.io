{% if page.alternate_url %}
<link rel="alternate" hreflang="{{ page.lang | default: 'en' }}" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{% if page.lang == 'zh' %}en{% else %}zh{% endif %}" href="{{ page.alternate_url | absolute_url }}">
{% endif %}
<script src="{{ '/assets/js/language.js' | relative_url }}" defer></script>
