<ul class="group-news">
{% assign news_limit = include.limit | default: site.data.group.news.size %}
{% for item in site.data.group.news limit: news_limit %}
<li><time>{% if page.lang == 'en' %}{{ item.date_en | default: item.date }}{% else %}{{ item.date }}{% endif %}</time><a href="{{ prefix | append: item.url | relative_url }}">{{ item[title_key] }}</a></li>
{% endfor %}
</ul>
