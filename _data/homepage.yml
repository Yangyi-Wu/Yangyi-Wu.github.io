highlights:
  - paper: /publication/2025-park-use-covid-peri-urban
    figure_caption_zh: 客观可达性与居民体验的两组对照。Wu 等（2025）。
    figure_caption_en: Measured access and resident experience in two peri-urban contexts. Wu et al. (2025).
    title_zh: 公园使用公平：可达性、需求与实际使用
    title_en: Park equity through access, needs and use
    summary_zh: 公园分布并不能完整反映使用公平。盐湖城研究将空间指标与居民感知、疫情期间的使用变化相互对照，发现南部近郊的感知可达性高于客观评价，西部社区则面临更突出的质量短板。公平评价需要同时回应居民的实际体验与改善需求。
    summary_en: Park distribution alone does not capture equity. In Salt Lake City, southern peri-urban residents perceived better access than spatial measures suggested, while western communities faced greater quality deficits. Comparing spatial indicators, residents' perceptions and pandemic-era use connects equity assessment to lived experience and improvement needs.
  - paper: /publication/2026-urban-form-politico-economic-transition-greater-bay-area
    figure_caption_zh: 区域化、权力与资本的尺度重组。Wang、Wu 与 Zhang（2026）。
    figure_caption_en: Regionalization and the rescaling of power and capital. Wang, Wu & Zhang (2026).
    title_zh: 城市转型：区域协作与土地驱动增长
    title_en: Regional cooperation and the persistence of land-driven growth
    summary_zh: 大湾区研究把区域化与分权化、市场化、全球化放在同一框架中，解释城市形态背后的权力与资本关系。区域协作与更高的斑块连通性、土地利用多样性及斑块密度相关，协作与竞争仍然并存；依靠土地推动增长的治理逻辑也未根本改变。
    summary_en: The Greater Bay Area study connects regionalization with decentralization, marketization and globalization to explain the power and capital relations behind urban form. Cooperation is associated with greater patch connectivity, land-use diversity and patch density. It coexists with competition without fundamentally displacing land-driven local growth.
