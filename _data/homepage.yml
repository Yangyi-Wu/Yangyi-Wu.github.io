zh:
  hero_lines: ['城市转型', '与空间不平等']
  lead: >-
    关注城市转型中的空间重组与机会分配：产业与就业向何处集聚，住房市场如何分化，公共资源为谁所用。
  pi: 伍杨屹副教授 · 武汉大学城市设计学院
  pi_statement: >-
    课题组从地理空间视角研究城市转型，关注企业与就业、住房市场和公共资源的空间重组，以及不同地区和群体的发展机会如何随之变化。
  pi_approach: >-
    研究结合定量与定性方法：用空间数据识别分布格局和关联，用问卷与访谈理解居民的行为、感知和需求，通过不同证据的相互对照解释空间差异的形成机制。
  pi_data: >-
    研究使用企业登记、住房交易、设施兴趣点（POI）、遥感影像与居民调查等数据，覆盖城市群、城市、社区及个体尺度。
  perspective_title: 地理空间视角
  introduction: >-
    产业调整、人口流动与公共投资重塑城市空间，影响企业区位、住房市场和公共设施使用。我们从地理空间视角解释这些变化，以及发展机会如何在不同地区和人群之间分配。
  approach: >-
    课题组 PI：伍杨屹，副教授，武汉大学城市设计学院。
  methods: >-
    课题组注重定性与定量相结合，将空间分析与问卷、访谈相互印证，解释城市空间格局及其形成机制，理解不同群体的日常经验。
  data_analysis: >-
    研究使用企业登记、住房交易、设施兴趣点（POI）、遥感影像与居民调查等数据，覆盖城市群、城市、社区及个体尺度，结合空间计量、网络分析与定性分析开展研究。
  research_intro: >-
    课题组连接城市变化的动力、空间组织与机会分配三个问题。制度和经济活动重塑城市，空间重构改变不同地方与人群的机会，既有的不平等又影响后续转型。
  invitation: >-
    欢迎对城市与经济地理、城乡规划和空间分析感兴趣的学生与同行，来信交流研究、招生与合作。
  conversation: 交流可以从一个具体的城市现象、一篇论文、一组数据观察，或者一个尚未成形的研究问题开始。研究训练、合作议题与招生安排，都欢迎来信讨论。
en:
  hero_lines: ['Urban Transformation', 'and Spatial Inequality']
  lead: >-
    Urban transformation reshapes opportunity: where do industries and jobs cluster, how do housing markets diverge, and whom do public resources serve?
  pi: Led by Associate Professor Yangyi Wu · School of Urban Design
  pi_statement: >-
    The UTSI Research Group studies urban transformation from a geospatial perspective, focusing on the spatial reorganization of firms and employment, housing markets and public resources, and how these changes affect opportunities across places and social groups.
  pi_approach: >-
    Our research combines quantitative and qualitative methods: spatial data identify patterns and relationships, while surveys and interviews reveal residents' behavior, perceptions and needs. Comparing these sources of evidence helps explain the mechanisms behind spatial differences.
  pi_data: >-
    Research uses firm registration records, housing transactions, amenity points of interest (POIs), remote sensing imagery and resident surveys, spanning city-region, city, neighborhood and individual scales.
  perspective_title: A geospatial perspective
  introduction: >-
    Industrial restructuring, migration and public investment reshape firm locations, housing markets and the use of public facilities. A geospatial perspective explains these changes and how they redistribute development opportunities across places and social groups.
  approach: >-
    Principal Investigator: Yangyi Wu, Associate Professor, School of Urban Design, Wuhan University.
  methods: >-
    We combine qualitative and quantitative methods, bringing spatial analysis into dialogue with surveys and interviews to explain urban spatial patterns and their underlying mechanisms, and to understand the everyday experiences of different social groups.
  data_analysis: >-
    Our research draws on firm registration and housing transaction records, amenity points of interest (POIs), remote sensing imagery and resident surveys. We work across city-region, city, neighborhood and individual scales, using spatial econometrics, network analysis and qualitative analysis.
  research_intro: >-
    Our research connects the drivers of urban change, spatial organization and the distribution of opportunities. Institutions and economic activities reshape cities; restructuring changes opportunities across places and groups, while existing inequalities influence subsequent transformation.
  invitation: >-
    We welcome students and colleagues interested in urban and economic geography, planning and spatial analysis. Get in touch about research, admissions or collaboration.
  conversation: A conversation can begin with an urban observation, a paper, a pattern in the data, or an emerging research question. Please get in touch to discuss research training, collaboration or admissions.
