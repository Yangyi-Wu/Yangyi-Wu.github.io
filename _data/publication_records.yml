2020-02-01-spatial-heterogeneity-housing-prices-large-datasets:
  authors: "Wu, Y., Wei, Y. D., & Li, H."
  doi: 10.1007/s12061-019-09301-x
  visual_reviewed: true
  visual: /images/publications/housing-connectivity-2020-v2-reviewed.png
  thumbnail: /images/publications/housing-connectivity-2020-v2-reviewed.png
  visual_source: "Conceptual synthesis of Wu, Wei & Li (2020), supplied PDF pp. 7-8 (Fig. 2), 12-13 (distance/density connectivity), 18 (Fig. 5), 29-30. Built-in image-generation tool, using original Fig. 2 as a conceptual reference; point patterns and search circles are hypothetical, not the observed 43-submarket map."
  visual_caption_zh: "依据 Wu, Wei & Li (2020) 的分类框架，把属性相似性、价格机制上的可替代性和基于距离与密度的空间连接性结合起来。原文以模型残差代理可替代性，实证识别出 43 个子市场。点位与圆圈仅解释方法，不是盐湖县的实测分类图，也不表示通勤或交易网络。"
  visual_caption_en: "Conceptual synthesis of Wu, Wei & Li (2020): attribute similarity, substitutability in price mechanisms and distance-and-density connectivity inform a hybrid classification. Hedonic residuals proxy substitutability; the empirical analysis identifies 43 submarkets. Points and circles explain the method, not the observed Salt Lake County classification or a commuting or transaction network."
  visual_alt_en: "A hypothetical parcel pattern illustrates spatial connectivity based on distance and density rather than strict continuity. Similarity and substitutability inform hybrid classification; 43 empirical submarkets are reported separately from the schematic pattern."
  visual_alt_zh: "假想地块点位解释基于距离与密度、而非严格连续性的空间连接性；属性相似性与价格机制可替代性共同支持混合分类，43 个实证子市场的数量与示意图分开呈现。"
  thumbnail_alt_en: "Housing submarket classification through spatial connectivity."
  thumbnail_alt_zh: "借助空间连接性识别住房子市场。"
  summary_reviewed: true
  summary_source: "Supplied publisher PDF: data and hybrid framework (pp. 7-8), connectivity and outlier processing (pp. 12-13), classification results (p. 18), conclusions (pp. 29-30)."
  contribution_en: "Housing submarkets need not be defined by simple spatial continuity. This study combines similarity, substitutability and spatial connectivity in a hybrid classification method, linking the definition of local markets to the price processes that operate within them."
  contribution_zh: "住房子市场并不能只按空间上的连续分布来划分。本文把相似性、可替代性与空间连接性结合起来，用一套混合分类方法界定子市场，让市场边界与内部的价格形成过程对应起来。方法的意义不在于把房价预测做得更准，而在于重新处理市场的边界与空间关系。"
  highlights_en:
    - "The Salt Lake County case uses a dataset of about 240,000 single-family houses and identifies 43 submarkets."
    - "A hybrid spatial data-mining procedure balances attribute similarity, spatial relationships and computational feasibility."
    - "Submarket-based models improve prediction and the interpretation of local housing markets relative to a non-submarket model."
  highlights_zh:
    - "以盐湖县约 24 万套独栋住宅为研究对象，识别出 43 个住房子市场。"
    - "混合空间数据挖掘方法同时兼顾属性相似性、空间关系和大规模数据处理的可行性。"
    - "与不划分子市场的模型相比，分市场建模不仅改善了预测，对地方住房市场的解释也更贴近空间差异。"
2020-03-01-firm-suburbanization-urban-sprawl:
  authors: "Wu, Y., Wei, Y. D., & Li, H."
  doi: 10.1080/00330124.2020.1750437
  summary_reviewed: true
  summary_source: "Supplied publisher PDF: abstract (p. 2), variables and spatial scales (pp. 7-8), general and sectoral results (pp. 15-17; Tables 5-7), discussion and conclusions (p. 18)."
  contribution_zh: "企业郊区化不等于城市中心衰退，也不是各类产业同步向外转移。本文在盐湖县比较制造业与生产性服务业，并区分本街区与周边邻里的条件。研究把中心及其周边增长、城市边缘增长和产业内部差异放在同一框架中，说明解释郊区化需要同时关注产业类型、邻里尺度与城市发展情境。"
  contribution_en: "Firm suburbanization is neither equivalent to core decline nor a uniform outward shift across industries. Comparing manufacturing and producer services in Salt Lake County, the study distinguishes local block-group conditions from surrounding-neighborhood conditions. It brings central and nearby growth, edge growth and within-sector differences into one framework, showing why sector, neighborhood scale and urban context matter to explanations of suburbanization."
  highlights_zh:
    - "依据 2000—2010 年企业数据，制造业呈现郊区化增长，生产性服务业则兼有中心及周边增长和新开发边缘增长；郊区增长与中心增长可以并存。"
    - "生产性服务业比制造业更敏感于社区特征，相关条件的关联也延伸到周边邻里。制造业在周边邻里尺度上主要表现为集聚关联，这不意味着本街区的社区条件无关。"
    - "不同生产性服务业分支的区位关联并不一致。研究比较的是企业数量与空间条件，没有追踪单家企业搬迁，也不把回归关联当作已证明的因果机制。"
  highlights_en:
    - "Firm data for 2000–2010 show suburbanizing manufacturing growth, while producer services combine center and nearby growth with growth at newly developed edges. Peripheral and central growth can coexist."
    - "Producer services are more sensitive to community characteristics, with associations extending into nearby areas. At the surrounding-neighborhood scale, manufacturing mainly shows agglomeration associations; local community conditions are not thereby irrelevant."
    - "Locational associations differ among producer-service branches. The analysis relates establishment counts to spatial conditions; it does not track individual firm relocations or establish causal mechanisms."
  visual_reviewed: true
  visual: /images/publications/firm-sector-neighborhood-2020-v2-reviewed.png
  thumbnail: /images/publications/firm-sector-neighborhood-2020-v2-reviewed.png
  visual_source: "Conceptual synthesis of Wu, Wei & Li (2020), supplied PDF pp. 2, 7-8, 15-18, Tables 5-7. Built-in image-generation tool; hypothetical urban strips illustrate sectoral growth patterns, and the neighborhood inset explicitly excludes the local block group."
  visual_caption_zh: "依据 Wu, Wei & Li (2020) 的产业与尺度对照：生产性服务业兼有中心及周边增长和新开发边缘增长，制造业则呈现郊区化增长。下方区分本街区与不含本街区的周边邻里。街区、点位和密度均为概念示意，不是实测地图、企业数量、搬迁轨迹或因果效应。"
  visual_caption_en: "Conceptual synthesis of Wu, Wei & Li (2020): producer services combine central and nearby growth with new-edge growth, while manufacturing shows suburbanizing growth. The inset separates the local block group from its surrounding neighborhood, which excludes that block group. Layouts, points and densities are schematic, not observed geography, establishment counts, relocation tracks or causal effects."
  visual_alt_zh: "生产性服务业与制造业的增长模式示意：前者在中心及周边和新开发边缘增长，后者表现为郊区化增长；下方区分本街区及排除本街区的周边邻里，说明解释随产业和尺度而变。"
  visual_alt_en: "Schematic producer-service and manufacturing growth patterns contrast central and new-edge growth with suburbanizing growth. An inset distinguishes the local block group from the surrounding area excluding it, highlighting sectoral and scale-dependent explanations."
  thumbnail_alt_zh: "郊区增长不等于中心衰退，解释随产业与邻里尺度变化。"
  thumbnail_alt_en: "Suburban growth does not mean core decline; sector and neighborhood scale matter."
2020-04-01-regional-inequality-spatial-polarization-place-mobility-jiangsu:
  authors: "Wei, Y. D., Wu, Y., Liao, F. H., & Zhang, L."
  doi: 10.1016/j.apgeog.2020.102296
  summary_reviewed: true
  summary_source: "Supplied publisher PDF: abstract and diagnostic distinctions (pp. 1-2), multiscale and spatial analyses, place-mobility and SOM results, synthesis and conclusions (pp. 13-15; Figs. 13-14)."
  contribution_zh: "缩小地区间的经济差距，与改变核心—边缘空间格局，并不是同一回事。本文把不平等程度、空间极化与地方在发展等级中的流动分开分析，说明常规差距指标下降仍可能伴随高低发展地区的持续集群和较弱的向上流动。研究由此把区域发展的判断，从单一的收敛或分化，推进到对差距、空间结构与地方机会的多尺度解释。"
  contribution_en: "A narrower economic gap is not the same as a changed spatial core-periphery structure. Separating inequality, polarization and mobility in places' development positions, the study shows how declining conventional inequality can coexist with persistent clusters of high and low development and limited upward mobility. It moves regional-development assessment beyond a single convergence-or-divergence verdict toward a multiscale account of gaps, spatial structure and place opportunities."
  highlights_zh:
    - "比较江苏 1978—2014 年的发展轨迹，并结合差距分解、空间自相关、地方流动与自组织映射，区分不同尺度和不同空间划分的变化。"
    - "2004 年后常规不平等指标下降，但苏南及苏中南部的高—高集群、苏北的低—低集群仍较稳定；极化趋势也随指标和地区划分而异。"
    - "部分地方的发展地位有所变化，整体核心—边缘等级却没有因此被打破。这里的地方流动指地区发展地位的变化，不是人口迁移，也不意味着所有落后地区都完全无法向上流动。"
  highlights_en:
    - "The study compares Jiangsu's development from 1978 to 2014 using inequality decomposition, spatial autocorrelation, place-mobility analyses and self-organizing maps across scales and geographical divisions."
    - "Conventional inequality declines after 2004, while high-high clusters in southern Jiangsu and southern central Jiangsu and low-low clusters in northern Jiangsu remain persistent. Polarization trends depend on the measure and regional division."
    - "Some places change development position without overturning the overall core-periphery hierarchy. Place mobility means changes in regions' development status, not population migration, and does not imply that every poorer region has zero upward mobility."
  visual_reviewed: true
  visual: /images/publications/regional-gap-structure-2020-v2-reviewed.png
  thumbnail: /images/publications/regional-gap-structure-2020-v2-reviewed.png
  visual_source: "Conceptual synthesis of Wei, Wu, Liao & Zhang (2020), supplied PDF pp. 1-2, 13-15 and Figs. 13-14. Built-in image-generation tool; symbolic gap spacing, hypothetical neighboring tiles and illustrative ordering are not empirical index series, Jiangsu boundaries or observed county ranks."
  visual_caption_zh: "依据 Wei et al. (2020) 区分差距、空间结构与地方发展地位流动：常规不平等下降，并不等于核心—边缘格局消失。不同极化指标和地区划分的走势也不相同。色块间距、相邻拼块与排列连线仅解释概念，不是江苏实测地图、指数曲线或县域排名。"
  visual_caption_en: "Conceptual synthesis of Wei et al. (2020): a decline in conventional inequality does not erase core-periphery structure. Polarization trends also differ by measure and geographical division. Symbolic spacing, neighboring tiles and ordering traces explain the concepts; they are not measured Jiangsu geography, index series or county rankings."
  visual_alt_zh: "三个概念对照：差距可以缩小，高—高与低—低集群仍持续，部分地方地位变化也未打破整体核心—边缘格局；所有色块和连线均为示意。"
  visual_alt_en: "Three conceptual views show a narrowing gap, persistent high-high and low-low spatial clusters, and some place mobility without overturning the core-periphery hierarchy. All tiles, spacing and ordering traces are schematic."
  thumbnail_alt_zh: "指标上的差距收敛不等于空间发展机会的收敛。"
  thumbnail_alt_en: "Convergence in an index is not convergence in spatial opportunity."
2021-01-01-trip-generation-trip-chains-polycentric-development-utah:
  authors: "Wei, Y. D., Xiao, W., & Wu, Y."
  doi: 10.1016/j.apgeog.2021.102488
  summary_reviewed: true
  summary_source: "Supplied publisher PDF: abstract (p. 1), employment-center and household-survey methods (pp. 4-6), observed center connections (Fig. 4, p. 8), behavioral models and conclusions (pp. 9-10)."
  contribution_zh: "拥有多个就业中心，并不意味着都市区的功能联系已经均衡。本文把就业分布的形态证据与居民出行链的功能证据相互对照，发现 Wasatch Front 虽有多个中心，日常活动联系仍以盐湖城市中心为主。研究将多中心判断从中心的数量与密度，推进到中心之间的联系及其承载日常活动的能力，而不是据此简单判定多中心规划失败。"
  contribution_en: "Multiple employment centers do not necessarily imply balanced metropolitan functions. Comparing employment-based morphology with household trip-chain evidence, the study finds that the Wasatch Front has several centers but daily activity links remain dominated by downtown Salt Lake City. It moves the assessment of polycentricity beyond center counts and densities toward their connections and role in everyday activity, without treating limited functional balance as proof that polycentric planning has failed."
  highlights_zh:
    - "结合就业数据识别中心，并利用 2012 年家庭出行调查比较中心内外的出行链、出行方式与中心间联系。"
    - "盐湖城市中心是主要功能核心，其他中心的联系较弱。城市中心更多是较长出行链中的停留点，完全在中心内部生成的链较少。"
    - "中心内部步行相对更常见，但区域整体仍以汽车出行为主。就业、设施和公共交通是政策讨论的重要条件，调查与模型关联并不直接证明干预的因果效果。"
  highlights_en:
    - "Employment data identify centers, while the 2012 household travel survey supports comparisons of trip chains, modes and connections within and outside those centers."
    - "Downtown Salt Lake City is the main functional core, with weaker links among other centers. Centers are more often stops in longer activity chains than generators of chains contained entirely within them."
    - "Walking is relatively more common within centers, but automobiles dominate region-wide. Jobs, amenities and transit inform the policy discussion; survey and model associations do not establish causal intervention effects."
  visual_reviewed: true
  visual: /images/publications/polycentricity-trip-chains-2021-v2-reviewed.png
  thumbnail: /images/publications/polycentricity-trip-chains-2021-v2-reviewed.png
  visual_source: "Conceptual synthesis of Wei, Xiao & Wu (2021), supplied PDF pp. 1, 4-6, 8-10 and Fig. 4. Built-in image-generation tool; nodes and links are an explanatory topology, not observed center locations, counts, trip volumes or household trajectories. No inconsistent sample or center totals are reproduced."
  visual_caption_zh: "依据 Wei, Xiao & Wu (2021) 对照就业形态与日常功能联系：多个中心并不自动形成均衡的功能网络，盐湖城市中心仍占主导。节点、连线和活动序列均为概念示意，不是实测地理位置、中心数量、出行量或个体轨迹；功能多中心程度较低也不等于规划失败。"
  visual_caption_en: "Conceptual synthesis of Wei, Xiao & Wu (2021): several employment centers do not automatically form a functionally balanced network, and downtown Salt Lake City remains dominant. Nodes, links and activity sequences are explanatory, not measured locations, center counts, trip volumes or individual trajectories. A low degree of functional polycentricity does not imply planning failure."
  visual_alt_zh: "就业中心的分散形态与集中于盐湖城市中心的日常活动联系相对照，下方用假想活动序列说明出行链；步行在中心内相对更常见，汽车仍主导区域出行。"
  visual_alt_en: "Dispersed employment-center morphology is contrasted with activity links dominated by downtown Salt Lake City. A hypothetical activity sequence illustrates trip chains; walking is relatively more common within centers, while cars dominate region-wide."
  thumbnail_alt_zh: "多个就业中心不保证功能联系均衡。"
  thumbnail_alt_en: "Multiple employment centers do not ensure functional balance."
2022-01-01-amenity-firm-agglomeration-local-creativity-producer-services-shanghai:
  authors: "Wu, Y., Wei, Y. D., Li, H., & Liu, M."
  doi: 10.1016/j.cities.2021.103421
  visual_reviewed: true
  visual: /images/publications/amenity-creativity-spatial-context-2022-v2-reviewed.png
  thumbnail: /images/publications/amenity-creativity-spatial-context-2022-v2-reviewed.png
  visual_source: "Refined conceptual synthesis of Wu, Wei, Li & Liu (2022), supplied PDF Fig. 1 (p. 4), creativity proxies (pp. 5-6), Table 2 distance-based proximity measures (p. 7), findings and limitations (pp. 12-16). Built-in image-generation tool edited the earlier reviewed graphic; the accessibility network was replaced by a single illustrative proximity segment."
  visual_caption_zh: "依据 Wu et al. (2022) 区分设施对企业集聚与地方创意的关联，并对照共址、邻近距离和设施集群等空间关系。原文以注册专利、著作权及软件著作权识别创意企业，并不测量全部城市文化创意。点位、邻近连线和中心至郊区的横线均为概念示意，不是实测流量、交通路线或效应曲线。"
  visual_caption_en: "Conceptual synthesis of Wu et al. (2022): amenity associations differ for firm agglomeration and local creativity, alongside co-location, proximity and amenity clusters. Registered patents, copyright and software copyright identify creative firms, not the full scope of urban cultural creativity. Points, proximity segments and CBD-to-suburb rules are schematic, not measured flows, transport routes or effect curves."
  visual_alt_en: "Co-location, distance-based accessibility and amenity clusters coexist. A qualitative CBD-to-suburb comparison contrasts amenity associations that weaken for firm agglomeration with those that persist for creativity proxied through registered outputs. No transport network or estimated effect curve is shown."
  visual_alt_zh: "共址、基于距离的可达性与设施集群等空间关系并存；定性对照显示设施与企业集聚的关联远离中央商务区后减弱，与注册成果所代理的地方创意的关联仍延续到郊区。图中不画实测交通网络或估计效应曲线。"
  thumbnail_alt_en: "Firm agglomeration and local creativity require different spatial explanations."
  thumbnail_alt_zh: "企业集聚与地方创意需要不同的空间解释。"
  summary_reviewed: true
  summary_source: "Supplied publisher PDF: theoretical framework (p. 4), creative-firm definitions and spatial measures (pp. 5-7), comparative findings (pp. 12-15), conclusions and limitations (pp. 14-16)."
  contribution_zh: "城市设施对一般企业集聚的吸引力，和对地方创意的吸引力并不相同。本文围绕这两个维度构建理论框架，并结合共址、可达性与高密度设施簇等空间关系，说明城市设施在上海都市区内部发挥的作用为何不同。研究也澄清了产业集聚理论与创意理论各自适用于什么研究对象、怎样的城市空间。"
  contribution_en: "Attractiveness to firm agglomeration and attractiveness to local creativity are distinct dimensions of urban amenities. The study develops a framework connecting these dimensions to co-location, accessibility and high-density amenity clusters within Shanghai. It clarifies how the applicability of agglomeration and creativity theories differs across research objects and urban space."
  highlights_zh:
    - "在 1 公里尺度上，城市设施对地方创意的解释力，强于对一般生产性服务业集聚的解释力。"
    - "共址、可达性与高密度设施簇等空间关系同时存在，无法用单一的距离指标涵盖。"
    - "设施与企业集聚的关联随远离中央商务区而减弱，与地方创意的关联则一直延续到郊区。研究主要依据横截面数据，因此不把这些关联直接当作因果证据。"
  highlights_en:
    - "At the 1-km scale, urban amenities explain local creativity more strongly than general producer-service agglomeration."
    - "Co-location, accessibility and high-density amenity clusters coexist as spatial relationships; a single distance measure cannot represent them all."
    - "Amenity associations with firm agglomeration weaken farther from the CBD, while associations with creativity persist into suburban areas. The largely cross-sectional analysis does not establish causality."
2022-02-01-neighborhood-built-environment-resilience-transportation-covid:
  authors: "Xiao, W., Wei, Y. D., & Wu, Y."
  doi: 10.1016/j.trd.2022.103428
  summary_reviewed: true
  summary_source: "Supplied publisher PDF: monthly station data (p. 4), BSTS relative-impact and resilience definitions (p. 5), regression-tree importance/Table 3 (p. 12), discussion and limits (pp. 11-14)."
  contribution_zh: "公共交通的客流损失与恢复能力，不是同一个问题。本文先用贝叶斯结构时间序列估计无疫情情境下的客流基线，再比较各站点在前后两个时期的相对损失及其变化。盐湖县轻轨案例显示，损失模型和恢复模型最突出的邻里关联因素不同，因此交通韧性不能只由客流下降幅度判断，也不能只凭一种建成环境指标解释。"
  contribution_en: "Ridership loss and recovery capacity are distinct questions. A Bayesian structural time-series model estimates a no-pandemic ridership baseline, against which station-level relative losses and their change across two periods are compared. The Salt Lake County light-rail case identifies different leading neighborhood correlates of loss and recovery. Transit resilience therefore cannot be inferred from the size of a ridership decline or explained by one built-environment indicator alone."
  highlights_zh:
    - "利用 2017—2021 年轻轨站点月度客流，以实际客流相对模型基线的偏差衡量冲击，以后期和前期相对影响之差衡量恢复。恢复指数不等于客流已完全回到疫情前水平。"
    - "回归树中，邻里少数族裔人口占比在前后两期损失模型中的重要性最高，建筑覆盖率在恢复模型中的重要性最高。这是预测关联，不是对族群或环境因素的因果归因。"
    - "初期客流骤降与居家建议的发布相伴，后续病例高峰并未带来同样的下降。本文据此强调政策情境、邻里差异与站点周边开放空间，但没有直接验证感染和出行变化的底层机制。"
  highlights_en:
    - "Monthly station ridership from 2017 to 2021 is compared with a modelled baseline. Recovery is the later-period relative impact minus the earlier-period impact, not evidence that ridership has fully returned to its pre-pandemic level."
    - "Neighborhood minority share has the highest regression-tree importance in both loss models; building coverage has the highest importance in the recovery model. These are predictive associations, not causal attributions to ethnicity or environmental conditions."
    - "The sharp early drop coincides with stay-at-home guidance, while later case peaks do not produce the same decline. The discussion emphasizes policy context, neighborhood differences and open space around stations without directly identifying the underlying infection-mobility mechanism."
  visual_reviewed: true
  visual: /images/publications/transit-loss-recovery-2022-v2-reviewed.png
  thumbnail: /images/publications/transit-loss-recovery-2022-v2-reviewed.png
  visual_source: "Conceptual synthesis of Xiao, Wei & Wu (2022), supplied PDF pp. 4-5, 11-14 and Table 3. Built-in image-generation tool; formula connectors denote calculation, not causation. No ridership series or recovery curves were invented."
  visual_caption_zh: "依据 Xiao, Wei & Wu (2022) 的测度定义与回归树结果：实际客流和模型基线共同构成相对影响，前后时期的相对影响之差衡量恢复。客流损失与恢复的主要关联因素不同。连线只表示计算关系，色带只区分时期，不表示实测客流或恢复速度；模型重要性不等于因果效应。"
  visual_caption_en: "Conceptual synthesis of the measures and regression-tree results in Xiao, Wei & Wu (2022): observed and modelled baseline ridership define relative impact; the difference between later and earlier impacts measures recovery. Loss and recovery have different leading correlates. Connectors show calculation only; colored bands distinguish periods, not observed ridership or recovery speed. Model importance is not a causal effect."
  visual_alt_zh: "轻轨客流损失和恢复的测度框架：实际客流相对模型基线计算相对影响，再比较前后时期。邻里少数族裔人口占比在损失模型中最突出，建筑覆盖率在恢复模型中最突出。"
  visual_alt_en: "Measurement framework separates light-rail ridership loss from recovery using observed ridership and a modelled baseline. Neighborhood minority share leads the loss models; building coverage leads the recovery model."
  thumbnail_alt_zh: "客流损失与恢复能力需要分开测量。"
  thumbnail_alt_en: "Measure ridership loss and recovery separately."
2023-03-01-urban-form-spatiotemporal-vulnerability-covid:
  authors: "Wu, Y., Wei, Y. D., & Liu, M."
  doi: 10.1080/00167428.2022.2155519
  summary_reviewed: true
  summary_source: "Supplied publisher PDF, including cover: abstract (p. 2), ZCTA data and DTW/beta-regression methods (pp. 6-7), Table 3 and stage results (pp. 12-14), interpretation and limitations (pp. 15-16)."
  contribution_zh: "城市形态与疫情脆弱性的关系，不能归结为密度越高风险越大，也不能用一套全时期关系解释。本文把社区类型、疫情阶段与城市形态的多个维度放在一起比较，区分人口密度和高不透水率城市用地。盐湖县案例说明，同一种空间条件的关联随阶段而变，多种紧凑发展条件的组合也可能抵消单一指标的不利关联。"
  contribution_en: "Urban-form associations with pandemic vulnerability cannot be reduced to higher density meaning higher risk or to one relationship across the entire pandemic. Comparing community types, pandemic stages and multiple form dimensions, the study distinguishes population density from highly impervious urban land use. The Salt Lake County case shows stage-dependent associations, with combinations of compact-development dimensions potentially offsetting adverse associations of individual indicators."
  highlights_zh:
    - "利用 2020 年 3 月至 2021 年 9 月的 34 个居住型邮编统计区数据，结合动态时间规整聚类与分阶段 beta 回归；少数族裔社区在初期和暴发期受到较大冲击，新郊区及偏远郊区社区在暴发期和恢复期更突出。"
    - "街道连通性与步行性在初期关联较高病例率，土地混合在暴发期成为重要关联因素。恢复期高不透水率城市用地仍呈不利关联，人口密度及其他形态维度并不呈现统一的风险方向。"
    - "多维度组合的结果支持按阶段和地方情境理解紧凑发展，而非否定或无条件肯定紧凑城市。样本、检测条件和研究时段有限，底层作用机制尚未确定。"
  highlights_en:
    - "The analysis combines dynamic-time-warping clustering and stage-specific beta regression for 34 residential ZCTAs, March 2020-September 2021. Minority communities are especially affected early and during the outbreak; new and remote suburban communities are especially affected during the outbreak and recovery."
    - "Street connectivity and walkability accompany higher initial case rates; land-use mix becomes prominent during the outbreak. Highly impervious urban land use remains adversely associated during recovery, while population density and other form dimensions do not share a uniform risk direction."
    - "The multidimensional results support interpreting compact development by stage and local context, not rejecting it or endorsing it unconditionally. Limited samples, testing conditions and time coverage constrain interpretation; underlying mechanisms remain unresolved."
  visual_reviewed: true
  visual: /images/publications/urban-form-stage-context-2023-v2-reviewed.png
  thumbnail: /images/publications/urban-form-stage-context-2023-v2-reviewed.png
  visual_source: "Conceptual synthesis of Wu, Wei & Liu (2023), supplied PDF pp. 2, 6-7, 12-16. Built-in image-generation tool; hypothetical blocks illustrate dimensions and qualitative intervals summarize community timing, not observed maps, infection rates or causal effects."
  visual_caption_zh: "依据 Wu, Wei & Liu (2023) 对照疫情初期、暴发期与恢复期：形态指标的关联和受冲击较大的社区类型随阶段变化，人口密度不能与高不透水率城市用地混为一谈。街区为假设示意；横线概括社区受影响的阶段，不表示病例数量、持续时间估计或效应大小。本文没有确定底层因果机制。"
  visual_caption_en: "Conceptual synthesis of Wu, Wei & Liu (2023): urban-form associations and the community groups especially affected vary across initial, outbreak and recovery stages. Population density is distinct from highly impervious urban land use. Blocks are hypothetical; intervals summarize stages of community burden, not case counts, estimated durations or effect sizes. Underlying causal mechanisms were not identified."
  visual_alt_zh: "三个疫情阶段的概念对照：初期突出连通性与步行性，暴发期突出土地混合，恢复期区分高不透水率用地与其他形态指标；下方对照少数族裔、新郊区及传统城市与郊区社区的受影响阶段。"
  visual_alt_en: "Three-stage conceptual comparison highlights connectivity and walkability initially, land-use mix during the outbreak, and impervious urban land use during recovery; qualitative intervals compare the timing of burden across community types."
  thumbnail_alt_zh: "城市形态与疫情脆弱性的关联随阶段和社区而变。"
  thumbnail_alt_en: "Urban-form associations vary by pandemic stage and community."
2023-04-01-remote-sensing-watershed-new-paradigm:
  authors: "Wang, J., Wu, Y., Hu, Z., & Zhang, J."
  doi: 10.3390/rs15102569
  summary_reviewed: true
  summary_source: "Supplied publisher PDF: editorial identification (p. 1), nature-human system and synthesis of 14 special-issue papers (p. 2), five proposed research priorities (pp. 2-3), data availability not applicable (p. 4)."
  contribution_zh: "流域遥感不仅是对某一种自然要素的监测，更需要连接自然过程、人类活动与实际决策。本文作为专题刊的编者述评，归纳流域研究的多尺度、多维度和跨学科特征，提出从多源数据和尺度联系出发，综合理解流域总体环境的研究议程。其贡献是梳理研究范式与未来重点，不是验证新的治理成效。"
  contribution_en: "Watershed remote sensing needs to connect natural processes, human activities and decision requirements rather than monitor one environmental layer in isolation. This special-issue editorial synthesizes the multiscale, multidimensional and interdisciplinary character of watershed research and proposes an agenda linking multisource data, scale interactions and the total environment. Its contribution is a research perspective and set of priorities, not a newly validated governance outcome."
  highlights_zh:
    - "综合专题刊的 14 篇研究，把流域理解为自然与人类活动相互联系的系统，强调物理、生物与社会经济过程的共同分析。"
    - "提出五项未来重点：多源数据融合、多尺度建模、总体环境分析、克服数据壁垒并推动共享，以及面向行业与决策需求。"
    - "建议遥感资料与现场观测、社会经济信息及其他地理数据互补，发展可互操作的数据和工具。文章没有新增实证数据，也不声称这些建议已产生可量化的治理收益。"
  highlights_en:
    - "The editorial synthesizes 14 special-issue papers and treats watersheds as interconnected nature-human systems, bringing physical, biological and socioeconomic processes into one research perspective."
    - "Five priorities are proposed: multisource integration, multiscale modelling, total-environment analysis, overcoming data barriers and sharing, and addressing industry and decision needs."
    - "Remote sensing is proposed alongside field observations, socioeconomic information and other geospatial data, supported by interoperable data and tools. The article adds no new empirical dataset or quantified governance-benefit evaluation."
  visual_reviewed: true
  visual: /images/publications/watershed-integrated-agenda-2023-v2-reviewed.png
  thumbnail: /images/publications/watershed-integrated-agenda-2023-v2-reviewed.png
  visual_source: "Conceptual synthesis of Wang, Wu, Hu & Zhang (2023), editorial PDF pp. 1-3. Built-in image-generation tool; catchment, streams, land-cover patches and grids are hypothetical, not remote-sensing observations or a validated governance-impact model."
  visual_caption_zh: "依据 Wang et al. (2023) 编者述评的五项研究重点，连接多源数据、多尺度分析、总体环境、决策需求和开放共享。中央流域、水系、用地与网格均为假设示意，不对应具体流域或实测遥感资料；连线表示研究内容的整合，不表示已验证的治理效果。"
  visual_caption_en: "Conceptual synthesis of the five research priorities in the editorial by Wang et al. (2023), connecting multisource data, multiscale analysis, the total environment, decision needs and open sharing. The watershed, streams, land-cover patches and grids are hypothetical, not a named watershed or observed remote-sensing data. Connectors express research integration, not validated governance effects."
  visual_alt_zh: "流域遥感研究议程：以自然与人类活动相联系的假设流域为中心，连接多源数据、多尺度分析、总体环境、决策需求和开放数据共享五个重点。"
  visual_alt_en: "Watershed remote-sensing research agenda connects a hypothetical nature-human watershed with multisource data, multiscale analysis, the total environment, decision needs and open data sharing."
  thumbnail_alt_zh: "从单层监测走向综合、面向决策的流域研究。"
  thumbnail_alt_en: "Beyond single-layer monitoring toward integrated watershed research."
2023-05-01-regional-development-inequality-city-regions-yangtze-river-delta:
  authors: "Qin, X., Wei, Y. D., Wu, Y., & Huang, X."
  doi: 10.1080/00167428.2021.2021780
  summary_reviewed: true
  summary_source: "Supplied publisher PDF including cover: abstract (p. 2), multiscale inequality and mobility analyses (pp. 12-22), discussion and cross-border/provincial-scale distinctions (pp. 22-24). Online 2022; website retains the final 2023 issue year."
  contribution_zh: "城市区域整体的趋同，并不意味着省内核心—边缘差距已经消失。本文把区域不平等、空间极化与地方发展位次变化联系起来，追踪长三角 1990—2018 年的演变。研究表明，跨省城市区域有自身的空间结构，不能只靠各省指标的拼接理解；判断一体化是否缓解差距，必须同时辨别所处阶段和地理尺度。"
  contribution_en: "Convergence across a city-region does not mean that provincial core-periphery divides have disappeared. Linking regional inequality, spatial polarization and changes in places' relative development positions, the study follows the Yangtze River Delta from 1990 to 2018. A cross-border city-region has its own spatial structure rather than simply combining provincial patterns. Assessing integration therefore requires attention to both development stage and geographical scale."
  highlights_zh:
    - "早期增长和向上位次变化较多集中于核心地区；后期外围地区增长加快、向上流动增加，整体不平等及极化程度有所下降。地方流动性指相对经济地位变化，不是人口迁移。"
    - "外围次中心的发展与更广泛的一体化相伴，但新的集聚和省内核心—边缘结构仍然存在，区域整体指标无法完整代表这些差距。"
    - "城市区域是跨行政边界的不平等分析尺度。多中心发展和外围支持属于研究的政策含义，不等于已经识别一体化政策的因果效应。"
  highlights_en:
    - "Early growth and upward place mobility are concentrated in core regions; later peripheral growth and upward movement accompany some decline in overall inequality and polarization. Place mobility concerns relative economic status, not population migration."
    - "Peripheral subcenters emerge alongside wider integration, while new concentrations and provincial core-periphery structures persist. Aggregate city-region measures do not fully represent those divides."
    - "City-regions form a cross-border scale for inequality analysis. Polycentric development and peripheral support are policy implications, not identified causal effects of integration policies."
  visual_reviewed: true
  visual: /images/publications/city-region-provincial-scales-2023-v2-reviewed.png
  thumbnail: /images/publications/city-region-provincial-scales-2023-v2-reviewed.png
  visual_source: "Conceptual synthesis of Qin, Wei, Wu & Huang (2023 final issue; 2022 online), supplied PDF pp. 2, 22-24. Built-in image-generation tool; matched hypothetical cities and provincial compartments show analytical scales, not YRD geography, measured index values or policy effects."
  visual_caption_zh: "依据 Qin et al. (2023) 的尺度比较：长三角整体的后期趋同，可以与省内核心—边缘差距并存。左右两图使用相同的假设点位，仅改变分析范围；方框与颜色不对应真实省界、城市位置或经济数值，也不表示各省的实际格局完全相同。下方概括发展阶段，不是统计曲线或政策因果链。"
  visual_caption_en: "Conceptual synthesis of the scale comparison in Qin et al. (2023): later YRD-wide convergence can coexist with provincial core-periphery divides. The two views use matched hypothetical places with different analytical extents. Compartments and colors are not real provincial boundaries, city locations or economic values, nor evidence that all provinces share identical patterns. The chronology summarizes stages, not a statistical series or policy-causal chain."
  visual_alt_zh: "以同一套假设点位对照跨省城市区域和省内分析：区域后期增长与向上流动，并不消除省内核心—边缘差距；下方区分核心主导增长、外围次中心形成与后期趋同。"
  visual_alt_en: "Matched hypothetical places contrast a cross-border city-region extent with separate provincial frames. Later peripheral growth and mobility can coexist with persistent provincial divides; a short chronology distinguishes development stages."
  thumbnail_alt_zh: "大区域趋同可以与省内分化并存。"
  thumbnail_alt_en: "Regional convergence can coexist with provincial divides."
2023-06-01-sprawl-development-urban-amenity-china:
  authors: "Zhang, D., Wu, Y., & Liu, M."
  doi: 10.3390/land12061180
  summary_reviewed: true
  summary_source: "Supplied publisher PDF: sprawl measure and noncausal model scope (p. 5), classification/Table 3 (p. 8), development-type interpretation (pp. 9-10), synthesis and limitations (pp. 13-14)."
  contribution_zh: "紧凑发展的趋势，不等于城市生活已经获得充分的服务支撑。本文仍以建成区扩张和人口变化的关系衡量蔓延，同时引入设施变化，辨别武汉不同街道的发展类型。研究识别出一种重要情形：传统郊区正在趋向紧凑、人口继续增长，人均设施增长却低于全市平均。这把蔓延分析从形态判断推进到对历史遗产和服务匹配的诊断。"
  contribution_en: "A compact-development trend does not guarantee adequate urban services. The study measures sprawl through built-up expansion relative to population change, then brings amenity change into the classification of Wuhan subdistricts. One important type combines compact growth, continued population growth and per-capita amenity growth below the city average. The contribution extends morphological diagnosis to inherited development patterns and the fit between growth and service provision."
  highlights_zh:
    - "结合 2015—2021 年人口、遥感与设施兴趣点（POI）资料，按蔓延趋势、设施变化和人口变化形成八类发展模式。设施不是蔓延指数的直接组成项。"
    - "城市更新、郊区化与乡村变化呈现不同组合。部分传统郊区虽趋向紧凑，仍带有过去蔓延发展的服务短板；这不是所有郊区都缺设施的统一判断。"
    - "空间过滤与地理加权回归用于描述关联和地方差异，并不识别因果效应。POI 及地表覆盖也不能直接代表服务质量、居民实际使用或详细用地功能。"
  highlights_en:
    - "Population, remote-sensing and POI data for 2015-2021 support eight development types combining sprawl trend, amenity change and demographic change. Amenities are not a direct component of the sprawl-index formula."
    - "Renewal, suburbanization and rural change produce different combinations. Some traditional suburbs show compact trends while retaining service shortfalls associated with past sprawl, not a universal shortage in every suburb."
    - "Spatial filtering and geographically weighted regression describe associations and local variation, not causation. POIs and land cover do not directly measure service quality, residents' use or detailed land-use functions."
  visual_reviewed: true
  visual: /images/publications/sprawl-amenity-legacy-2023-v2-reviewed.png
  thumbnail: /images/publications/sprawl-amenity-legacy-2023-v2-reviewed.png
  visual_source: "Conceptual synthesis of Zhang, Wu & Liu (2023), supplied PDF pp. 5, 8-10, 13-14. Built-in image-generation tool; the planning sketch illustrates Type 2, not an observed Wuhan neighborhood, measured population or amenity map."
  visual_caption_zh: "依据 Zhang, Wu & Liu (2023) 八类发展模式中的一种：紧凑趋势、持续人口增长与低于全市平均的人均设施增长可以并存。手绘街区只说明规划情境，不是武汉实测街道或设施分布。图中区分蔓延测度与服务诊断，避免把设施变化直接当作蔓延指数；引线不表示因果作用。"
  visual_caption_en: "Conceptual synthesis of one of the eight development types in Zhang, Wu & Liu (2023): a compact trend, continued population growth and below-average per-capita amenity growth can coexist. The planning sketch is not a mapped Wuhan neighborhood or amenity distribution. The graphic distinguishes sprawl measurement from service diagnosis; leader lines do not imply causation."
  visual_alt_zh: "假设传统郊区的规划手绘示意与三项诊断并列：紧凑发展趋势、人口持续增长、人均设施增长低于全市平均。下方区分建成区扩张相对人口变化的蔓延测度和设施服务诊断。"
  visual_alt_en: "A hypothetical suburban planning sketch accompanies a compact-development trend, continued population growth and below-average per-capita amenity growth. The lower comparison separates sprawl measurement from service diagnosis."
  thumbnail_alt_zh: "紧凑趋势并不保证服务充分。"
  thumbnail_alt_en: "Compact trends do not guarantee adequate services."
2023-07-01-tech-firm-births-agglomeration-economies:
  authors: "Xiong, N., Wei, Y. D., & Wu, Y."
  doi: 10.1016/j.cities.2023.104349
  visual_reviewed: true
  summary_source: "Publisher abstract and highlights, https://www.sciencedirect.com/science/article/pii/S0264275123001610, checked 2026-10-01. The supplied source set contains no full PDF for this paper; no additional coefficient or causal-mechanism claim is made."
  visual_source: "Existing built-in-engine conceptual matrix retained after comparison with the publisher abstract and highlights. Signs summarize reported model associations by type and scale, not magnitudes or causal effects."
  visual_caption_zh: "Xiong, Wei & Wu (2023) 的类型—尺度对照：集聚外部性并非处处以相同方式发挥作用。图中的 detected effect 概括所检验模型中的关联，不表示因果效应或效应大小；未检出也不等于在所有情境中永远没有作用。这些关联不能直接解释为观测到的知识流动或因果机制。"
  visual_caption_en: "Type-scale comparison in Xiong, Wei & Wu (2023): agglomeration externalities do not operate uniformly across space. Detected effect summarizes reported model associations, not causal effects or their magnitude; no detected effect is not proof of no relationship in every context. These associations cannot be read directly as observed knowledge flows or causal mechanisms."
  visual: /images/publications/agglomeration-scales-reviewed.png
  thumbnail: /images/publications/agglomeration-scales-reviewed.png
  visual_alt_en: "Specialization and related variety act at neighborhood and city-wide scales; unrelated variety shows no detected effect; urbanization economies act negatively only city-wide."
  visual_alt_zh: "专业化和相关多样性在邻里与全市尺度都发挥作用，非相关多样性未显现影响，城市化经济只在全市尺度上呈负向作用。"
  thumbnail_alt_en: "Agglomeration externalities differ by type and scale."
  thumbnail_alt_zh: "不同类型的集聚外部性，作用尺度也不同。"
  summary_reviewed: true
  contribution_en: "Agglomeration economies are not one uniform local advantage. The study distinguishes four forms of agglomeration and their spatial reach, showing why the type of externality and the scale of analysis must be considered together when explaining tech firm births."
  contribution_zh: "集聚并不是一种作用一致的区位优势。本文区分四类集聚经济及其空间作用范围，说明解释科技企业创生时，必须同时考虑外部性的类型与分析尺度，不能只看单一的集聚程度。"
  highlights_en:
    - "Specialization and related variety are associated with firm births at both neighborhood and city-wide scales."
    - "Specialization is more pronounced at the neighborhood scale and has a broader spatial reach than related variety."
    - "Unrelated variety has no detected effect across the tested scales; urbanization economies operate negatively only at the city-wide scale."
  highlights_zh:
    - "专业化和相关多样性在邻里与全市尺度上都有作用。"
    - "专业化的作用在邻里尺度更突出，作用范围也比相关多样性更广。"
    - "非相关多样性在所检验的各个尺度上都未显现影响；城市化经济只在全市尺度上呈负向作用。"
2023-08-01-remote-sensing-of-watershed-book:
  authors: "Wang, J., Hu, Z., Wu, Y., & Zhang, J. (Eds.)"
  doi: 10.3390/books978-3-0365-8131-6
2023-09-01-green-infrastructure-inequality-covid:
  authors: "Wu, Y., Wei, Y. D., Liu, M., & García, I."
  doi: 10.1016/j.ufug.2023.128027
  visual_reviewed: true
  visual: /images/publications/green-alternatives-joint-response-2023-v2-reviewed.png
  thumbnail: /images/publications/green-alternatives-joint-response-2023-v2-reviewed.png
  visual_source: "Supplied publisher PDF, Wu et al. (2023), survey design p. 3, joint-response models pp. 6-7 and discussion p. 8. Built-in image-generation tool; illustrative park and trail, not measured geography."
  visual_caption_zh: "公园与步道的使用变化应联合判断：两者可能同时减少、保持不变、同时增加，也可能方向相反。矩阵展示相对于前一年自报访问频次的九类组合，颜色区分概念类别，不代表样本数量、发生概率或因果效应。个人资源、既有可达性和社区条件与这些选择有关；公园与步道为示意，不对应实际地理。"
  visual_caption_en: "Park and trail visit changes are assessed jointly: both can decline, remain unchanged, increase, or move in opposing directions. The matrix illustrates nine combinations of self-reported frequency changes relative to the previous year. Colors distinguish conceptual categories, not sample counts, probabilities or causal effects. Personal resources, existing access and neighborhood conditions are associated with these choices; park and trail drawings are illustrative, not measured geography."
  visual_alt_zh: "公园与步道各有减少、不变、增加三种响应，形成九类联合使用变化；个人资源、既有可达性与社区条件影响可选择的替代方案。"
  visual_alt_en: "A three-by-three matrix of less, unchanged and more park and trail visits; opposing responses show why green-space alternatives matter alongside access."
  thumbnail_alt_zh: "绿地公平不只关乎可达性，也关乎不同居民有哪些替代选择。"
  thumbnail_alt_en: "Green-space equity involves alternatives as well as access."
  summary_reviewed: true
  contribution_zh: "绿色基础设施公平不只是离公园或步道有多近，还涉及居民能否调整使用方式、获得替代选择。本文联合分析疫情期间公园与步道访问频次的九类变化，发现两者可能相互补充，也可能一增一减。个人资源、既有可达性和社区条件与这些不同响应有关，因此把绿地使用简化成单一的增减尺度，会遗漏不平等的重要表现。"
  contribution_en: "Green-infrastructure equity concerns alternatives as well as proximity. Jointly analyzing nine combinations of pandemic-era park and trail visit changes, the study identifies both complementary and opposing responses. These patterns are associated with personal resources, existing access and neighborhood conditions, showing why a single linear increase-or-decrease measure can miss important dimensions of inequality."
  highlights_zh:
    - "公园与步道的使用变化不能合并成一个简单的增减指标；同时减少与转向另一类绿地，代表不同的处境。"
    - "较富裕居民拥有更多替代选择；部分老年居民的使用减少，却没有通过增加另一类绿地访问来补偿。"
    - "使用减少者所在社区的感染水平更高，但问卷没有直接识别需求增加、感染风险或使用变化之间的因果机制。"
  highlights_en:
    - "Joint reductions and shifts toward an alternative green space represent different situations, not positions on one simple ordinal scale."
    - "Wealthier respondents have more alternatives; some older respondents report fewer visits without a compensating increase in another type of green space."
    - "Respondents reporting fewer visits live in neighborhoods with higher infection levels; the survey does not causally identify demand, infection or behavioral responses."
2023-10-01-regional-drinking-water-pakistan:
  authors: "Wu, Y., & Wei, Y. D."
  doi: 10.1080/00330124.2023.2183414
  visual_reviewed: true
  visual: /images/publications/water-inequality-spatial-concentration-2023-v2-reviewed.png
  thumbnail: /images/publications/water-inequality-spatial-concentration-2023-v2-reviewed.png
  visual_source: "Supplied publisher PDF, Wu and Wei (2023), source definitions p. 6, coverage comparisons pp. 9-12, discussion pp. 13-14 (including cover). Built-in image-generation tool; category and analytical-dimension diagrams, not empirical maps or numerical charts."
  visual_caption_zh: "改良水源在本研究中包括自来水、手压泵和电动泵，自来水是其中的子类。全人口地区比较中，改良水源覆盖的非空间不平等较低，空间集中却更强，说明差距大小与空间组织是不同维度。图中符号仅作概念说明，不表示指标数值；不同省份和城乡人群并非都有同样的格局。水源类别覆盖也不等于安全、持续可用的饮水服务。"
  visual_caption_en: "The study defines improved sources as tap water, hand pumps and motor pumps; tap water is a subset. In the all-population district comparison, improved-water coverage has lower non-spatial inequality but stronger spatial concentration than tap-water coverage. Symbols illustrate analytical dimensions, not index values; provincial and urban-rural patterns vary. Source-category coverage does not establish safe, continuously available drinking-water service."
  visual_alt_zh: "改良水源包含自来水和泵水；较低的地区覆盖差距仍可伴随更强的空间集中，覆盖率也不能证明水质安全或供应可靠。"
  visual_alt_en: "Tap water is nested within improved sources; lower across-district inequality coexists with stronger spatial concentration, and coverage alone does not establish safe, reliable water."
  thumbnail_alt_zh: "饮水供给的差距大小与空间集中并不等价。"
  thumbnail_alt_en: "Water-coverage inequality and spatial concentration are distinct."
  summary_reviewed: true
  contribution_zh: "饮水覆盖的地区差距缩小，并不意味着空间排斥随之消失。本文将不平等、极化和空间集中结合起来，发现巴基斯坦改良水源覆盖的非空间差距小于自来水覆盖，空间集中却更强。自来水是改良水源的一部分，两种统计口径揭示了不同的区域格局及其相关条件，也说明规划判断不能只依赖一个覆盖率或不平等指标。"
  contribution_en: "Smaller regional gaps in drinking-water coverage do not necessarily imply less spatial exclusion. Combining inequality, polarization and spatial concentration, the study finds lower non-spatial inequality but stronger spatial concentration for improved-water coverage than for tap-water coverage in Pakistan. Tap water is a subset of improved sources; the two measures reveal different regional patterns and associated conditions, showing why a single coverage or inequality indicator is insufficient."
  highlights_zh:
    - "研究使用 2015 年水源调查覆盖的 112 个地区；改良水源包括自来水、手压泵和电动泵，不是与自来水互斥的另一类系统。"
    - "自来水覆盖与自然环境的关联更明显，改良水源覆盖对人口条件更敏感；城乡模型的关联也有差异。"
    - "较低的非空间不平等可以掩盖空间集聚与排斥；水质、可达性和持续供应仍需独立评估，不能由水源类别直接推定。"
  highlights_en:
    - "The 2015 source survey covers 112 districts. Improved sources include tap water, hand pumps and motor pumps, rather than a mutually exclusive second system."
    - "Tap-water coverage is more closely associated with environmental conditions; improved-water coverage is more sensitive to demographic conditions, with urban-rural differences."
    - "Lower non-spatial inequality can conceal spatial clustering and exclusion. Quality, accessibility and availability need separate assessment, not inference from source category alone."
2023-11-01-urban-form-air-pollution-walking:
  authors: "Wei, Y. D., Wu, Y., Xiao, W., Garcia, I., & Wen, M."
  doi: 10.1016/j.jth.2023.101686
  visual_reviewed: true
  visual: /images/publications/walking-frequency-duration-2023-v2-reviewed.png
  thumbnail: /images/publications/walking-frequency-duration-2023-v2-reviewed.png
  visual_source: "Supplied publisher PDF, Wei et al. (2023), data/methods pp. 4-5, spatial model Table 3 p. 7, discussion pp. 8-9. Built-in image-generation tool; hypothetical street segment, qualitative PM associations checked against Table 3."
  visual_caption_zh: "频次与时长、起点与终点及潜在路径不能相互替代。原文表 3 的空间模型中，PM 与起点、潜在路径的步行时长呈显著负关联，与起点的频次呈显著正关联；其余三项未达到 5% 显著性水平。符号表示关联方向与显著性，不是效应大小或因果结论；虚线路段为示意，污染指标来自排放数据插值，不是个人暴露剂量或健康结果。"
  visual_caption_en: "Frequency and duration, and origins, destinations and potential paths, are not interchangeable. In the spatial models of Table 3, PM has significant negative associations with origin and potential-path duration and a significant positive association with origin frequency; the other three comparisons are not significant at the 5% level. Symbols show direction and significance, not effect size or causality. The dashed street segment is illustrative; pollution indicators are interpolated from emissions, not measured personal exposure or health outcomes."
  visual_alt_zh: "PM 空间模型六项对照：起点与潜在路径时长负关联，起点频次正关联；终点时长以及潜在路径、终点频次不显著。"
  visual_alt_en: "Six spatial-model PM comparisons: negative origin and potential-path duration associations, positive origin-frequency association, and three nonsignificant comparisons."
  thumbnail_alt_zh: "步行频次、时长及其空间位置可能给出不同的判断。"
  thumbnail_alt_en: "Walking frequency, duration and spatial position can yield different interpretations."
  summary_reviewed: true
  contribution_zh: "步行活动多，并不意味着步行时间更长，也不能直接等同于更健康的环境。本文区分起点、终点与潜在路径，分别分析频次和时长，并控制空间效应。结果表明，紧凑用地对步行的关联会随指标和空间位置改变，污染较高的地方也可能出现频繁但较短的步行。研究把单一的步行性判断推进为对活动、空间情境与环境负担的联合分析。"
  contribution_en: "More walking trips do not necessarily mean longer walks or a healthier environment. Separating origins, destinations and potential paths, the study models frequency and duration with spatial controls. Associations with compact land use vary by outcome and spatial position, while frequent but shorter walks can coincide with higher pollution indicators. The contribution is a joint analysis of activity, spatial context and environmental burden, rather than a single walkability measure."
  highlights_zh:
    - "控制空间效应后，紧凑用地不再与更高频次显著相关，并与潜在路径的步行时长呈负关联。"
    - "就业类型混合与起点、终点的频次和时长呈正关联；职住混合在这些模型中却呈负关联，不能把不同混合方式视作同一种机制。"
    - "PM 的关联随频次、时长及空间位置而不同；污染估计不是个人剂量，模型也没有测量健康改善或识别因果效应。"
  highlights_en:
    - "After spatial controls, compact land use is not significantly associated with higher frequency and is negatively associated with potential-path walking duration."
    - "Job-type mixture is positively associated with origin and destination frequency and duration, while housing-job mixture has negative associations in these models."
    - "PM associations differ across frequency, duration and spatial position. Pollution estimates are not personal doses, and the models do not measure health improvements or causal effects."
