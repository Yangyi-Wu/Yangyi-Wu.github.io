2023-07-01-tech-firm-births-agglomeration-economies:
  authors: "Xiong, N., Wei, Y. D., & Wu, Y."
  doi: 10.1016/j.cities.2023.104349
  visual_reviewed: true
  visual: /images/publications/agglomeration-scales-reviewed.png
  thumbnail: /images/publications/agglomeration-scales-reviewed.png
  visual_alt_en: "Specialization and related variety act at neighborhood and city-wide scales; unrelated variety shows no detected effect; urbanization economies act negatively only city-wide."
  visual_alt_zh: "专业化与相关多样性在邻里和全市尺度发挥作用，非相关多样性未显示影响，城市化经济仅在全市尺度表现为负向作用。"
  thumbnail_alt_en: "Agglomeration externalities differ by type and scale."
  thumbnail_alt_zh: "不同集聚外部性具有不同的尺度效应。"
  featured: true
  summary_reviewed: true
  contribution_en: "Agglomeration economies are not one uniform local advantage. The study distinguishes four forms of agglomeration and their spatial reach, showing why the type of externality and the scale of analysis must be considered together when explaining tech firm births."
  contribution_zh: "集聚并不是一种作用一致的区位优势。本文区分四类集聚经济及其空间作用范围，说明解释科技企业创生时，必须同时考虑外部性的类型与分析尺度，不能用单一的集聚程度替代。"
  highlights_en:
    - "Specialization and related variety are associated with firm births at both neighborhood and city-wide scales."
    - "Specialization is more pronounced at the neighborhood scale and has a broader spatial reach than related variety."
    - "Unrelated variety has no detected effect across the tested scales; urbanization economies operate negatively only at the city-wide scale."
  highlights_zh:
    - "专业化和相关多样性在邻里与全市尺度均发挥作用。"
    - "专业化的作用在邻里尺度更突出，其空间作用范围也比相关多样性更广。"
    - "非相关多样性在所检验的尺度上未显示影响；城市化经济仅在全市尺度表现为负向作用。"
