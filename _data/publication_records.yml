2022-01-01-amenity-firm-agglomeration-local-creativity-producer-services-shanghai:
  authors: "Wu, Y., Wei, Y. D., Li, H., & Liu, M."
  doi: 10.1016/j.cities.2021.103421
  visual_reviewed: true
  visual: /images/publications/amenity-creativity-spatial-context-reviewed.png
  thumbnail: /images/publications/amenity-creativity-spatial-context-reviewed.png
  visual_alt_en: "Co-location, accessibility and amenity clusters coexist as spatial relationships. A qualitative CBD-to-suburb comparison contrasts amenity associations that weaken for firm agglomeration with those that persist for creativity. The lines are not estimated effect curves or mapped flows."
  visual_alt_zh: "共址、可达性与设施集群等空间关系同时存在。从中心城区到郊区的定性对照显示，设施与企业集聚的关联随远离中央商务区而减弱，与地方创意的关联则一直延续到郊区。图中线条并非估计出的效应曲线，也不是实测流量。"
  thumbnail_alt_en: "Firm agglomeration and local creativity require different spatial explanations."
  thumbnail_alt_zh: "企业集聚与地方创意需要不同的空间解释。"
  summary_reviewed: true
  contribution_zh: "城市设施对一般企业集聚的吸引力，和对地方创意的吸引力并不相同。本文围绕这两个维度构建理论框架，并结合共址、可达性与高密度设施簇等空间关系，说明城市设施在上海都市区内部发挥的作用为何不同。研究也澄清了产业集聚理论与创意理论各自适用于什么研究对象、怎样的城市空间。"
  contribution_en: "Attractiveness to firm agglomeration and attractiveness to local creativity are distinct dimensions of urban amenities. The study develops a framework connecting these dimensions to co-location, accessibility and high-density amenity clusters within Shanghai. It clarifies how the applicability of agglomeration and creativity theories differs across research objects and urban space."
  highlights_zh:
    - "在 1 公里尺度上，城市设施对地方创意的解释力，强于对一般生产性服务业集聚的解释力。"
    - "共址、可达性与高密度设施簇等空间关系同时存在，无法用单一的距离指标涵盖。"
    - "设施与企业集聚的关联随远离中央商务区而减弱，与地方创意的关联则一直延续到郊区。研究主要依据横截面数据，因此不把这些关联直接当作因果证据。"
  highlights_en:
    - "At the 1-km scale, urban amenities explain local creativity more strongly than general producer-service agglomeration."
    - "Co-location, accessibility and high-density amenity clusters coexist as spatial relationships; a single distance measure cannot represent them all."
    - "Amenity associations with firm agglomeration weaken farther from the CBD, while associations with creativity persist into suburban areas. The largely cross-sectional analysis does not establish causality."
