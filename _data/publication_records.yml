2020-02-01-spatial-heterogeneity-housing-prices-large-datasets:
  authors: "Wu, Y., Wei, Y. D., & Li, H."
  doi: 10.1007/s12061-019-09301-x
  visual_reviewed: true
  visual: /images/publications/housing-connectivity-reviewed.png
  thumbnail: /images/publications/housing-connectivity-reviewed.png
  visual_alt_en: "Similarity, substitutability and spatial connectivity combine to identify 43 housing submarkets in Salt Lake County."
  visual_alt_zh: "把相似性、可替代性与空间连接性结合起来，在盐湖县识别出 43 个住房子市场。"
  thumbnail_alt_en: "Housing submarket classification through spatial connectivity."
  thumbnail_alt_zh: "借助空间连接性识别住房子市场。"
  summary_reviewed: true
  contribution_en: "Housing submarkets need not be defined by simple spatial continuity. This study combines similarity, substitutability and spatial connectivity in a hybrid classification method, linking the definition of local markets to the price processes that operate within them."
  contribution_zh: "住房子市场并不能只按空间上的连续分布来划分。本文把相似性、可替代性与空间连接性结合起来，用一套混合分类方法界定子市场，让市场边界与内部的价格形成过程对应起来。方法的意义不在于把房价预测做得更准，而在于重新处理市场的边界与空间关系。"
  highlights_en:
    - "The Salt Lake County case uses a dataset of about 240,000 single-family houses and identifies 43 submarkets."
    - "A hybrid spatial data-mining procedure balances attribute similarity, spatial relationships and computational feasibility."
    - "Submarket-based models improve prediction and the interpretation of local housing markets relative to a non-submarket model."
  highlights_zh:
    - "以盐湖县约 24 万套独栋住宅为研究对象，识别出 43 个住房子市场。"
    - "混合空间数据挖掘方法同时兼顾属性相似性、空间关系和大规模数据处理的可行性。"
    - "与不划分子市场的模型相比，分市场建模不仅改善了预测，对地方住房市场的解释也更贴近空间差异。"
