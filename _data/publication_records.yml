2025-05-01-urban-park-equity-wuhan:
  authors: "Yang, Y., Wu, Y., & Jiao, H."
  doi: 10.3390/su17052255
  visual_reviewed: true
  visual: /images/publications/park-matching-reviewed.png
  thumbnail: /images/publications/park-matching-reviewed.png
  visual_alt_en: "Quality-adjusted park services are compared with age-sensitive demand; 28.25 percent of Wuhan communities have unmet park demand."
  visual_alt_zh: "把考虑质量的公园服务供给与不同年龄群体的需求匹配起来；武汉案例中，28.25% 的社区存在需求缺口。"
  thumbnail_alt_en: "Park equity depends on matching services to differentiated needs."
  thumbnail_alt_zh: "公园公平取决于服务供给是否匹配不同人群的需求。"
  summary_reviewed: true
  contribution_en: "Park provision is not the same as park equity. By combining quality-adjusted service capacity and accessibility with age-sensitive demand, this study evaluates whether services match residents' needs. This explains why a well-supplied central area can still face a serious shortfall."
  contribution_zh: "公园资源多，并不等于公园服务公平。本文按公园质量、服务能力和可达性衡量供给，同时考虑不同年龄群体的使用需求，把公平的判断从资源数量转向服务与需求的匹配。这解释了为什么供给充足的中心城区，仍可能存在明显的需求缺口。"
  highlights_en:
    - "In the Wuhan case, 28.25% of communities have unmet park demand."
    - "Central areas combine high supply with high demand; an apparently favorable resource distribution can conceal a service deficit."
    - "The assessment supports different responses: upgrading existing parks in constrained central areas and addressing underserved suburban locations."
  highlights_zh:
    - "武汉案例中，28.25% 的社区公园需求没有得到满足。"
    - "中心城区同时存在较高的供给和较高的需求，只看资源分布会掩盖服务不足。"
    - "评估结果指向不同的改进方向：中心城区应侧重提升现有公园的服务能力，服务不足的郊区则应补充供给。"
2025-06-01-park-use-covid-peri-urban:
  authors: "Wu, Y., Wei, Y. D., Liu, M., & García, I."
  doi: 10.1016/j.landurbplan.2024.105269
  visual_reviewed: true
  visual: /images/publications/park-equity-experience-v4-reviewed.png
  thumbnail: /images/publications/park-equity-experience-v4-reviewed.png
  visual_source: "Conceptual synthesis of Wu et al. (2025), publisher PDF abstract and discussion/conclusions (pp. 1, 10-11). Built-in image-generation tool; streets and parks are illustrative, not measured Salt Lake City geography."
  visual_caption_zh: "依据 Wu et al. (2025) 的概念归纳：南部近郊存在客观可达性劣势，居民评价却更乐观；西部近郊与中心城区的客观可达性相近，但感知不同，设施改善需求更高，疫情期间的使用也更容易受质量观感问题影响。街区与公园为示意，不对应实际地理；连线表示对照，不是因果效应。"
  visual_caption_en: "Conceptual synthesis of Wu et al. (2025): southern peri-urban residents perceive access more optimistically despite measured disadvantage. Western peri-urban and urban-center communities have similar measured access but different perceptions; western residents report greater infrastructure needs and pandemic-era use vulnerability associated with perceived quality. Streets and parks are illustrative, not measured geography; connectors indicate comparisons, not causal effects."
  visual_alt_en: "Park equity beyond provision: southern peri-urban residents perceive access more optimistically than spatial measures suggest. Western peri-urban and urban-center communities have similar measured access but different perceptions; western residents report greater infrastructure needs and park use sensitive to quality perceptions during COVID-19. Conceptual regional comparisons, not empirical maps."
  visual_alt_zh: "公园公平的两组概念对照：南部近郊居民对可达性的感知比空间指标显示的更乐观；西部近郊与中心城区的客观可达性相近，但感知不同，且西部居民的设施改善需求更高，疫情期间公园使用更容易受质量观感问题影响。图中空间结构为示意。"
  thumbnail_alt_en: "Resource measures can miss context-specific park disadvantage in peri-urban communities."
  thumbnail_alt_zh: "只看公园资源指标，可能遗漏不同近郊社区的不利处境。"
  wu_author_role: first
  authorship_source: "Publisher PDF, p. 1: Yangyi Wu is the first listed author; Yehua Dennis Wei is the corresponding author."
  summary_reviewed: true
  contribution_zh: "公园公平不能只靠客观可达性和质量指标来判断。本文把资源评价、居民感知、改善需求与疫情期间的使用变化放在一起，在城区与近郊的对照中观察这些维度的差异。研究说明，空间指标反映的资源条件，与居民实际感受到、能够使用的公园服务并不总是一致，近郊社区的脆弱性也因此容易被低估。"
  contribution_en: "Objective accessibility and quality measures alone cannot fully describe park equity. Comparing urban and peri-urban communities, the study connects resource assessments, residents' perceptions, improvement needs and pandemic-era changes in use. It shows why measured provision can diverge from experienced services, leaving peri-urban vulnerabilities insufficiently understood."
  highlights_zh:
    - "在盐湖城案例中，南部近郊居民对可达性的评价，比传统空间指标所显示的更乐观。"
    - "中心城区与西部近郊的客观可达性相近，但居民感知不同；公园质量也呈现明显的东西差异。"
    - "西部社区对基础设施改善的需求更高，疫情期间的公园使用也更容易受质量观感问题影响。"
  highlights_en:
    - "In Salt Lake City, southern peri-urban residents perceive accessibility more positively than conventional spatial measures suggest."
    - "Urban-center and western peri-urban communities have similar objective accessibility but different perceptions; park quality also shows a marked east-west divide."
    - "Western communities report greater needs for basic infrastructure improvements, and their pandemic-era park use is more vulnerable to perceived quality problems."
2025-07-01-multi-scale-geographic-environmental-monitoring:
