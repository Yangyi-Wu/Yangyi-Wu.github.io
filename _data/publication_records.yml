2025-09-01-neighborhood-amenity-housing-prices-urban-china:
  authors: "Qu, Z., Wu, Y., & Liu, M."
  doi: 10.1007/s12061-025-09667-1
  visual_reviewed: true
  visual: /images/publications/amenity-housing-framework-v2-reviewed.png
  thumbnail: /images/publications/amenity-housing-framework-v2-reviewed.png
  visual_source: "Conceptual synthesis of Qu, Wu & Liu (2025), publisher PDF abstract, four-dimensional framework (Fig. 1, pp. 5-6) and conclusion (p. 22). Built-in image-generation tool; the neighborhood is hypothetical and the evidence is cross-sectional."
  visual_caption_zh: "依据 Qu, Wu & Liu (2025) 的四维框架：数量与质量刻画可达性，功能混合与空间组织刻画活动条件。武汉案例中，私人服务的房价关联更依赖质量，基本服务则数量与质量都重要，且关联呈非线性、随城市情境变化。街区为概念示意，不是实测地图；横截面关联不能解释为因果效应。"
  visual_caption_en: "Conceptual synthesis of Qu, Wu & Liu (2025): quantity and quality describe accessibility; functional mix and spatial arrangement describe activity conditions. In Wuhan, private-service housing-price associations rely more on quality, while both quantity and quality matter for essential services. Associations are nonlinear and context-dependent. The neighborhood is hypothetical, not measured geography; cross-sectional associations are not causal estimates."
  visual_alt_en: "A four-dimensional amenity framework: accessibility covers quantity and quality; activity covers functional mix and spatial arrangement. Private-service housing-price associations rely more on quality, while essential services depend on both quantity and quality. Associations are nonlinear and context-dependent; the neighborhood is schematic."
  visual_alt_zh: "设施评价的四维框架：可达性包含数量与质量，活动条件包含功能混合与空间组织。私人服务的房价关联更依赖质量，基本服务则数量与质量都重要；关联为非线性且随情境变化，街区为示意。"
  thumbnail_alt_en: "Amenity value depends on quantity, quality, functional mix and spatial arrangement, not proximity alone."
  thumbnail_alt_zh: "设施的价值取决于数量、质量、功能混合与空间组织，不能只看距离。"
  summary_reviewed: true
  contribution_zh: "本文对社区设施价值的解释，从距离和数量扩展到设施的组合方式：用数量和质量刻画可达性，用功能混合和空间组织刻画活动条件。这一框架把「能接近哪些设施」和「设施如何共同支撑日常活动」放在一起考虑，说明同样的设施供给，在不同组合和城市情境下可能对应不同的住房价值。"
  contribution_en: "The study extends the explanation of amenity value beyond proximity and counts to the configuration of neighborhood resources. Quantity and quality describe accessibility, while functional mix and spatial arrangement describe activity conditions. The framework links which amenities are available with how they jointly support daily activities, helping explain why similar provision can have different housing-value associations across configurations and urban contexts."
  highlights_zh:
    - "武汉案例结合线性回归与 XGBoost-SHAP，分析数量、质量、功能混合和空间组织四类特征。"
    - "私人服务的房价关联更依赖质量，基本服务则数量与质量都重要，因此不宜用统一的设施评价标准。"
    - "模型识别出非线性与阈值关系，提示中心区、郊区与外围地区的偏好存在差异；由于是横截面数据，不能据此推断因果关系。"
  highlights_en:
    - "The Wuhan case combines linear regression and XGBoost-SHAP to examine quantity, quality, functional mix and spatial arrangement."
    - "Private services rely more on quality in their housing-price associations, while both quantity and quality matter for essential services."
    - "Nonlinear and threshold patterns suggest different preferences across central, suburban and peripheral contexts. Cross-sectional evidence does not establish causality."
2025-10-01-urban-amenities-knowledge-intensive-industry-locations:
  authors: "Teng, Y., Wu, Y., & Liu, M."
  doi: 10.1016/j.apgeog.2025.103659
  visual_reviewed: true
  visual: /images/publications/amenity-industry-nested-v2-reviewed.png
  thumbnail: /images/publications/amenity-industry-nested-v2-reviewed.png
  visual_source: "Simplified conceptual synthesis of Teng, Wu & Liu (2025), publisher PDF Fig. 1 and discussion/conclusions (pp. 10, 13). Built-in image-generation tool; sector outlines and local point locations are hypothetical, not Wuhan geography or data."
  visual_caption_zh: "依据 Teng, Wu & Liu (2025) 原文图 1 简化整理：都市区的资源获取条件形成潜在竞争优势，地方设施的供给与多样性支撑地方营造，两个嵌套尺度共同解释产业区位吸引力。中心城区与外围地区的需求不同，不能套用统一的设施组合。板块边界、街区及点位均为假想示意，不是武汉实测地图；箭头表示理论关系，不是因果效应估计。"
  visual_caption_en: "Simplified synthesis of Fig. 1 in Teng, Wu & Liu (2025): metropolitan resource access underpins potential competitive advantage, while local amenity availability and diversity support placemaking. These nested scales explain industrial attractiveness; central and outer sectors have different amenity needs. Sector outlines, streets and points are hypothetical, not measured Wuhan geography. Arrows express theoretical relationships, not causal estimates."
  visual_alt_en: "Adapted from the paper's proposed framework: metropolitan potential resource access underpins competitive advantage, while local amenity availability and diversity support placemaking. These nested mechanisms jointly explain industrial attractiveness within an urban spatial context; schematic connections are not causal estimates."
  visual_alt_zh: "按原文理论框架重绘：都市区层面的潜在资源获取条件构成竞争优势，地方层面的设施供给与多样性支撑地方营造。两个嵌套尺度的机制共同解释城市空间中的产业吸引力，图中连线为示意，不代表因果效应估计。"
  thumbnail_alt_en: "Industrial attractiveness combines metropolitan resource advantages and local placemaking."
  thumbnail_alt_zh: "理解产业区位吸引力，需要同时看都市区资源优势与地方营造。"
  wu_author_role: co_corresponding
  authorship_source: "Publisher PDF, p. 1: Yangyi Wu (*) and Meitong Liu (**) are both explicitly identified as corresponding authors."
  summary_reviewed: true
  contribution_zh: "本文用多尺度框架解释城市设施与知识密集型产业区位之间的关系。都市区尺度的设施分布决定各城市板块的潜在竞争优势，地方尺度的设施供给与多样性则通过地方营造形成具体区位的吸引力。研究把地方营造从环境品质和社会生活的讨论，延伸到对产业集聚的解释，并强调它的作用取决于所在城市板块的功能与条件。"
  contribution_en: "The study develops a multi-scalar framework linking urban amenities to knowledge-intensive industry location. Metropolitan amenity patterns establish potential competitive advantages across urban sectors, while local provision and diversity contribute to place-based attractiveness. It extends placemaking beyond environmental quality and social life to the explanation of industrial agglomeration, with effects dependent on each sector's functions and conditions."
  highlights_zh:
    - "以武汉汽车产业为案例，区分都市区的板块优势与地方的区位吸引力，不把城市内部视为均质空间。"
    - "地方设施的多样性与产业集聚相关；就供给水平而言，基础设施和公共服务比消费型设施更受重视。"
    - "中心城区与外围地区的设施需求不同，地方营造应当与该板块的功能和目标产业相匹配，而不是套用统一的建设模式。"
  highlights_en:
    - "The Wuhan automotive-industry case distinguishes metropolitan sectoral advantages from local attractiveness rather than treating intra-urban space as homogeneous."
    - "Local amenity diversity is associated with industrial clustering; high provision is especially valued for infrastructure and public services rather than consumer amenities."
    - "Central and peripheral areas have different amenity needs. Placemaking should fit the functions of each urban sector and the requirements of its target industries."
2025-11-01-institutions-urban-space-residential-markets-shanghai:
  authors: "Wei, Y. D., Wu, Y., & Li, H."
  doi: 10.1080/07352166.2023.2285465
  visual_reviewed: true
  visual: /images/publications/housing-tenure-institutional-reviewed.png
  thumbnail: /images/publications/housing-tenure-institutional-reviewed.png
  visual_alt_en: "Within a shared global, institutional and urban context, buyers place greater emphasis on service amenities and renters on job opportunities. The comparison treats tenure as a dimension of urban inequality, not as an absolute division of preferences."
  visual_alt_zh: "在同样的全球化、制度与城市空间背景下，买方更看重服务设施，租方更看重就业机会。这项租售比较把住房占有方式视为城市不平等的一个维度，而不是把两类人群的偏好截然分开。"
  thumbnail_alt_en: "One city, two housing markets: tenure differentiates urban opportunities."
  thumbnail_alt_zh: "同一座城市里，租与售是两个不同的市场：住房占有方式与城市机会差异相关。"
  summary_reviewed: true
  contribution_zh: "本文把住房的租赁与销售放在同一分析框架下，把房价的解释从住宅属性和区位扩展到全球化、制度与都市区空间结构。研究指出，买方和租方面对的机会与约束并不相同，住房占有方式由此成为理解城市不平等与居住分异的一个重要维度；租金和售价不能用同一套住房市场假设来解释。"
  contribution_en: "By comparing housing sales and rents within one framework, the study extends price explanations beyond dwelling attributes and location to globalization, institutions and metropolitan spatial structure. Buyers and renters face different opportunities and constraints, making tenure an important dimension of urban inequality and residential segregation rather than treating the housing market as uniform."
  highlights_zh:
    - "上海案例中，租方更看重就业机会，买方更看重服务设施；这并不意味着哪一群人只关心单一因素。"
    - "在制度与全球化背景下，就业和优质服务向中心城区的集中，与租售群体的空间差异相关，郊区则显得相对更包容。"
    - "这一比较框架同时关涉全球、都市区和地方三个层面的背景；作者也指出，代理变量和定量数据不足以完整解释全球化与社会排斥的过程。"
  highlights_en:
    - "In Shanghai, renters place relatively greater emphasis on employment opportunities and buyers on service amenities; neither group is assumed to have exclusive preferences."
    - "Institutional and globalizing contexts help explain the concentration of opportunities and services in central areas and unequal residential outcomes; suburbs appear relatively more inclusive."
    - "The framework connects global, metropolitan and local contexts. Proxy variables and quantitative data do not fully capture globalization or the processes of social exclusion."
2025-12-01-polycentric-urban-development-china:
  authors: "Wei, Y. D., Xiao, W., & Wu, Y."
  doi: 10.1007/s11769-025-1516-3
  visual_reviewed: true
  visual: /images/publications/polycentric-cartographic-reviewed.png
  thumbnail: /images/publications/polycentric-cartographic-reviewed.png
  visual_alt_en: "The same five schematic urban centers illustrate the distinction between morphological concentration and functional connectivity. Several physical centers can coexist with dependence on a dominant network center; scale, measurement and institutions matter."
  visual_alt_zh: "用同一组五个示意中心对照形态上的集聚与功能上的联系：多个空间中心可能仍然依赖同一个网络核心。理解多中心发展，需要区分尺度、测度和制度背景。"
  thumbnail_alt_en: "Multiple physical centers do not necessarily form a balanced functional network."
  thumbnail_alt_zh: "多个空间中心不一定构成均衡的功能网络。"
  summary_reviewed: true
  contribution_zh: "这篇综述把多中心发展从一种规划形态目标，转为需要区分尺度、测度和形成机制的研究问题。人口或就业在空间上的集聚，与城市之间、中心之间的功能联系并不是一回事。因此，既不能只凭中心数量判断多中心程度，也不能预设多中心必然带来效率、公平或环境改善。"
  contribution_en: "This review treats polycentric development not simply as a desired spatial form but as a question of scale, measurement and underlying mechanisms. Spatial concentrations of population or employment are distinct from functional links between centers. Counting centers alone cannot establish the degree of polycentricity or guarantee efficiency, equity or environmental benefits."
  highlights_zh:
    - "已有研究显示，中国不少城市区域仍有较强的单中心特征，同时又在形成新的次中心；形态指标与功能指标识别出的中心并不总是一致。"
    - "多中心发展的形成机制因城市和尺度而异，经济、制度和交通因素共同起作用，其中中央与地方政府的作用尤其重要。"
    - "文章是对已有文献的综合，并未提供新的全国实测地图；疫情之后多中心结构与韧性之间的长期关系，仍有待检验。"
  highlights_en:
    - "The reviewed evidence describes many Chinese urban regions as strongly monocentric with emerging subcenters; centers identified through morphological and functional metrics do not always coincide."
    - "Economic, institutional and transportation mechanisms differ across cities and scales, with a significant role for the state."
    - "This is a literature synthesis, not a new nationwide mapped dataset. Long-term relationships between post-pandemic polycentricity and resilience remain open to investigation."
2026-01-01-urban-sprawl:
  authors: "Wu, Y."
  doi: 10.1007/978-3-031-92524-5_211
2026-12-01-urban-form-politico-economic-transition-greater-bay-area:
  authors: "Wang, S., Wu, Y., & Zhang, X."
  doi: 10.1016/j.landusepol.2026.108280
  wu_author_role: co_corresponding
  authorship_source: "Wang et al. (2026), published article, p. 1: Yangyi Wu and Xianchun Zhang are marked as corresponding authors. DOI: 10.1016/j.landusepol.2026.108280."
  summary_reviewed: true
  summary_source: "Wang et al. (2026), supplied published PDF, pp. 3-13: conceptual framework, methods, results, discussion and conclusions."
  contribution_zh: "本文将区域化理解为地方政府权力与资本配置在区域尺度上的重组，把分权化、市场化、全球化的“三重过程”拓展为“四重过程”，解释城市形态如何在竞争与协作并存的制度环境中演化。大湾区证据表明，区域协作能够增强斑块连通性和土地利用多样性，但仍受地方政府以土地驱动增长的逻辑约束；空间重组由产业、交通基础设施与房地产共同推动，而非只由房地产开发解释。"
  contribution_en: "The study conceptualizes regionalization as a rescaling of state power and capital allocation, extending decentralization, marketization and globalization into a quadruple-process framework. It explains urban form through the changing relations between local governments, capital and intercity cooperation. Evidence from the Greater Bay Area shows that cooperation can improve patch connectivity and land-use diversity without fundamentally displacing land-driven local growth. Urban restructuring operates through a compound growth model involving industry, transport infrastructure and real estate, rather than property development alone."
  highlights_zh:
    - "区域化并非独立于其他转型过程的外部因素：它回应城市竞争产生的区域失衡，也反过来调整地方政府的行为和资本的区位选择。"
    - "区域协作与更高的斑块连通性、土地利用多样性相关，同时也与更高的斑块密度相关。连通与破碎化可以并存，不能把跨城协作等同于紧凑发展。"
    - "机制分析区分了产业投资的调节作用，以及基础设施和房地产的中介路径。不同部门可能放大或抵消同一转型过程的形态效应。"
    - "核心与外围城市的反应因形态指标而异。区域协作下，集聚度、形状复杂性和连通性的响应存在差异，但扩张规模、斑块密度与土地利用多样性的响应差异未达到统计显著。"
    - "研究覆盖大湾区 11 座城市的 2010-2019 年，以 30 米土地覆盖数据构建六维形态指标，结合双向固定效应、调节分析与 PLS-SEM。投资机制分析因统计口径不同仅使用内地 9 市；这些模型不应被解读为政策实验意义上的因果识别。"
  highlights_en:
    - "Regionalization is mutually constitutive with the other transition processes: it responds to imbalances generated by intercity competition and reshapes local government strategies and capital location choices."
    - "Intercity cooperation is associated with higher patch connectivity and land-use diversity, but also higher patch density. Connectivity and fragmentation can coexist; cooperation should not be equated with compact development."
    - "Mechanism analysis distinguishes industry's moderating role from infrastructure and real estate mediation pathways. Sectoral investment can amplify or offset the morphological effects of the same transition process."
    - "Core-periphery differences depend on the morphological outcome. Under regionalization, responses differ in aggregation, shape complexity and connectivity, but not significantly in urban area, patch density or land-use diversity."
    - "The study covers 11 Greater Bay Area cities in 2010-2019, measuring six dimensions of urban form with 30 m land-cover data and using two-way fixed effects, moderation analysis and PLS-SEM. Investment mechanism analysis covers only the nine mainland cities because of statistical differences; these models do not establish policy-experiment causal identification."
