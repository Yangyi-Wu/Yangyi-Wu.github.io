en:
  name: Urban Transformation and Spatial Inequality
  type: UTSI Research Group
  affiliation: School of Urban Design, Wuhan University
  about: >-
    The UTSI Research Group, led by Associate Professor Yangyi Wu at Wuhan University's School of Urban Design, conducts empirical research in urban and economic geography. Our work concerns the spatial organization of firm location, housing markets and public resources, and how these processes shape development opportunities across places and social groups.
  agenda: >-
    Urban change affects places and people differently. We connect economic transformation, spatial restructuring and the distribution of opportunities, moving between regions, cities, neighborhoods and individual experience. Our aim is to explain how these differences arise and the conditions under which they persist or change.
  methods_title: Data and methods
  methods: >-
    Two relationships deserve particular attention: proximity becomes real connection only through daily flows between centers, and provision becomes actual use only through residents' experience. Park accessibility metrics and residents' own assessments sometimes point in opposite directions.
  practice_title: Research and planning
  practice: >-
    Our work informs questions about industrial location, housing and public resource provision. We distinguish findings that depend on local conditions from those that may inform planning elsewhere, and consider whose needs are met by different spatial arrangements.
  pi_title: Principal investigator
  member_names_note: Members are listed using their preferred public names.
  pi_name: Yangyi Wu
  pi_role: Associate Professor · Department of Urban Planning
  pi_bio: Yangyi Wu works in urban and economic geography, with a focus on urban spatial change, amenities and unequal access to resources. He joined Wuhan University in 2022 after postdoctoral research at the University of Utah.
  education_title: Education
  education: ['PhD, Geography, University of Utah, 2020', 'MS, Geospatial Information Sciences, University of Texas at Dallas, 2015', 'Bachelor’s degree, Surveying and Mapping Engineering, Wuhan University, 2013']
  faculty: Faculty profile
  cv: Full CV
  project_intro: Projects led by the group and those we contribute to.
  led: Principal investigator
  collaborative: Participation and collaboration
  source_label: Project information from the faculty profile
  join_intro: We welcome students interested in urban and economic geography, planning and spatial inequality. A background in human geography, planning, geospatial science, computing or economics can offer a useful starting point.
  growth_title: Research and growth
  contact_title: Get in touch
  contact: Please email Yangyi Wu with your academic background, research interests and a question you would like to explore. A CV and an example of relevant work are helpful. Admissions follow the university’s official procedures.
  recruitment_title: Admissions
  recruitment_note: Programs, available places and application arrangements are subject to Wuhan University's annual admissions announcements.
  assistant_title: Research assistants
  assistant: >-
    Undergraduate and master’s students interested in the group’s research are welcome to join ongoing work as research assistants; please get in touch by email.
  exchange_title: Academic exchange
  exchange: >-
    Visiting students and scholars are welcome to spend time with the group, and colleagues interested in collaboration are welcome to get in touch by email.
  news_intro: Publications and academic activities involving Yangyi Wu and collaborators.
zh:
  name: 城市转型与空间不平等
  type: UTSI课题组
  affiliation: 武汉大学城市设计学院
  about: >-
    课题组由武汉大学城市设计学院伍杨屹副教授牵头，从事城市与经济地理的实证研究，关注企业区位、住房市场和公共资源的空间组织，以及这些过程如何影响不同地方、不同人群的发展机会。
  agenda: >-
    城市变化对不同地方和人群的影响并不相同。我们把经济转型、空间重构和机会分配联系起来，在区域、城市、社区与个体经验之间寻找解释，理解这些差异如何形成，以及在什么条件下延续或改变。
  methods_title: 数据与方法
  methods: >-
    两组关系尤其值得关注：从地理邻近到实际联系，需要中心之间的日常流动来验证；从资源供给到实际使用，中间隔着居民的体验。公园的可达性指标和居民自己的评价，有时指向相反的方向。
  practice_title: 研究与规划
  practice: >-
    研究回应产业区位、住房和公共资源配置中的实际问题。我们关注不同空间安排满足了谁的需要，也分清哪些结论依赖地方情境、哪些可以为其他城市的规划提供参考。
  pi_title: 课题组负责人
  member_names_note: 成员姓名按本人公开偏好显示。
  pi_name: 伍杨屹
  pi_role: 副教授 · 城市规划系
  pi_bio: 伍杨屹从事城市与经济地理研究，关注城市空间变化、城市设施与资源获取的不平等。曾在美国犹他大学从事博士后研究，2022 年加入武汉大学城市设计学院。
  education_title: 教育经历
  education: ['2020 年，犹他大学，地理学博士', '2015 年，德克萨斯大学达拉斯分校，地理空间信息科学硕士', '2013 年，武汉大学，测绘工程学士']
  faculty: 学院个人主页
  cv: 完整简历
  project_intro: 以下为课题组主持与参与的科研项目。
  led: 主持项目
  collaborative: 参与及合作项目
  source_label: 项目信息来源：学院个人主页
  join_intro: 欢迎对城市与经济地理、城乡规划和空间不平等感兴趣的同学。人文地理、城乡规划、地理信息、计算机、经济学等不同背景，都能为这些问题提供新的切入角度。
  growth_title: 研究与成长
  contact_title: 联系方式
  contact: 请通过邮件介绍你的学习背景、研究兴趣，以及想深入探讨的问题，可以附上简历和相关研究成果。正式申请请按学校招生程序办理。
  recruitment_title: 招生安排
  recruitment_note: 招生专业、名额与申请安排，以武汉大学当年度招生通知为准。
  assistant_title: 科研助理
  assistant: >-
    长期欢迎对课题组研究方向感兴趣的本科生、硕士生以科研助理身份参与研究，有意者请邮件联系。
  exchange_title: 学术交流
  exchange: >-
    欢迎访问学生、访问学者来组交流，也欢迎有意开展合作研究的同行邮件联系。
  news_intro: 伍杨屹及合作者的论文发表与学术活动。
research_values:
  - word: Understand
    label_zh: 理解问题
    label_en: Context and questions
    description_zh: 从真实的城市现象出发，厘清问题的背景、对象与尺度。
    description_en: Start with real urban situations and clarify the context, people and spatial scales involved.
  - word: Think
    label_zh: 独立思考
    label_en: Independent thinking
    description_zh: 结合理论审视经验观察，提出有依据、可讨论的解释。
    description_en: Use theory to question observations and develop explanations that can be debated and tested.
  - word: Study
    label_zh: 严谨求知
    label_en: Rigorous inquiry
    description_zh: 用合适的方法分析可靠的证据，如实说明结论及其局限。
    description_en: Match methods to questions, work carefully with evidence and be clear about the limits of each finding.
  - word: Inspire
    label_zh: 相互启发
    label_en: Learning from one another
    description_zh: 在讨论、合作与反馈中拓展思路，也帮助彼此成长。
    description_en: Share ideas, collaborate and offer thoughtful feedback to help one another grow.
projects:
  - id: talent-amenities
    lead: true
    period: '2025–2027'
    role_zh: 主持
    role_en: Principal investigator
    funder_zh: 国家自然科学基金青年项目
    funder_en: NSFC Young Scientists Fund
    title_zh: 主客观舒适性视角下人才城市生活空间选择偏好与分异机制研究：以武汉市为例
    title_en: Talent’s urban living-space preferences and differentiation through subjective and objective amenities in Wuhan
    question_zh: 城市设施的客观条件与个人感知，如何共同塑造人才对生活空间的选择与分化？
    question_en: How do objective amenity conditions and subjective perceptions help explain talent’s living-space choices and differentiation?
  - id: residential-wellbeing
    period: '2024–2027'
    role_zh: 参与
    role_en: Participant
    funder_zh: 国家自然科学基金面上项目
    funder_en: NSFC General Program
    title_zh: 立体化居住环境对幸福感的结构化影响及时空效应研究
    title_en: Structural influences and spatiotemporal effects of three-dimensional residential environments on well-being
  - id: health-place
    period: '2023–2027'
    role_zh: 合作
    role_en: Collaborator
    funder_zh: 美国国立卫生院专项项目
    funder_en: National Institutes of Health
    title_zh: 地区社会经济条件与个体健康及死亡风险：地方机制与个体心理社会过程
    title_en: 'Area-level Socioeconomic Conditions and Individual level Health and Mortality: Exploring Place-Based Mechanisms and Individual level Psychosocial Processes'
  - id: comparative-inequality
    period: '2018–2023'
    role_zh: 参与
    role_en: Participant
    funder_zh: 美国国家科学基金会
    funder_en: National Science Foundation
    title_zh: 区域不平等动态比较：多尺度与跨国视角
    title_en: 'Comparative Regional Inequality Dynamics: Multiscalar and Multinational Perspectives'
