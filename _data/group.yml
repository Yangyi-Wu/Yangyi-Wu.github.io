en:
  name: Urban Transformation and Spatial Inequality
  type: UTSI Research Group
  affiliation: School of Urban Design, Wuhan University
  about: >-
    The UTSI Research Group, led by Associate Professor Yangyi Wu at Wuhan University's School of Urban Design, conducts empirical research in urban and economic geography. Our work concerns the spatial organization of firm location, housing markets and public resources, and how these processes shape development opportunities across places and social groups.
  agenda: >-
    Urban change means different things to different people, and aggregate indicators often conceal that. A sale–rental comparison in Shanghai found that renters and buyers value the same block on entirely different grounds: renters respond to job access and social services, buyers to ownership value and investment conditions. In Jiangsu, falling inequality indices coincided with an almost unmoved core–periphery structure. Our analysis therefore runs from the metropolitan scale down to neighborhoods and individuals, to establish the conditions under which these relationships hold.
  methods_title: Data and methods
  methods: >-
    We combine firm- and housing-level microdata, amenity POIs, remote sensing and resident surveys, chiefly through spatial econometrics, network analysis and spatial classification. Two relationships deserve particular attention: proximity becomes real connection only through daily flows between centers, and provision becomes actual use only through residents' experience — park accessibility metrics and residents' own assessments sometimes point in opposite directions.
  practice_title: Research and planning
  practice: >-
    The endpoint of this work is planning and policy. Polycentricity policy calls for caution: it can foster regional ties, but it can also lengthen commutes and deepen core–periphery divides. Park provision should be judged by the match between supply and demand, with area per capita only one dimension. Industrial policy and placemaking work best in concert, with different emphases in central and peripheral districts. We aim to distinguish which conclusions depend on local context and which can inform planning elsewhere.
  pi_title: Principal investigator
  pi_name: Yangyi Wu
  pi_role: Associate Professor · Department of Urban Planning
  pi_bio: Yangyi Wu works in urban and economic geography, with a focus on urban spatial change, amenities and unequal access to resources. He joined Wuhan University in 2022 after postdoctoral research at the University of Utah.
  education_title: Education
  education: ['PhD, Geography, University of Utah, 2020', 'MS, Geospatial Information Sciences, University of Texas at Dallas, 2015', 'Bachelor’s degree, Surveying and Mapping Engineering, Wuhan University, 2013']
  faculty: Faculty profile
  cv: Full CV
  project_intro: Projects led by the group and those we contribute to.
  led: Principal investigator
  collaborative: Participation and collaboration
  source_label: Project information from the faculty profile
  join_intro: We welcome students interested in urban and economic geography, planning and spatial inequality. A background in human geography, planning, geospatial science, computing or economics can offer a useful starting point.
  growth_title: Research and growth
  contact_title: Get in touch
  contact: Please email Yangyi Wu with your academic background, research interests and a question you would like to explore. A CV and an example of relevant work are helpful. Admissions follow the university’s official procedures.
  recruitment_title: Admissions
  recruitment_note: Programs, places and application arrangements follow Wuhan University’s annual admissions announcements.
  news_intro: Publications and academic activities involving Yangyi Wu and collaborators.
zh:
  name: 城市转型与空间不平等
  type: UTSI课题组
  affiliation: 武汉大学城市设计学院
  about: >-
    课题组由武汉大学城市设计学院伍杨屹副教授牵头，从事城市与经济地理的实证研究，关注企业区位、住房市场和公共资源的空间组织，以及这些过程如何影响不同地方、不同人群的发展机会。
  agenda: >-
    城市变化对不同人意味着不同的东西，总量指标常常掩盖这一点。上海的租售比较发现，租房者和买房者评价同一个街区，依据完全不同：前者在意通勤是否方便、社会服务是否齐全，后者更看重产权价值和投资属性。江苏的追踪研究则显示，全省不平等指数在下降，核心与边缘的格局却几乎没有变化。所以我们的分析从都市区一直做到社区和个人，弄清这些关系在什么条件下成立。
  methods_title: 数据与方法
  methods: >-
    研究结合企业与住房微观数据、设施 POI、遥感和居民问卷，以空间计量、网络分析和空间分类为主要方法。两组关系尤其值得关注：从地理邻近到实际联系，需要中心之间的日常流动来验证；从资源供给到实际使用，中间隔着居民的体验——公园的可达性指标和居民自己的评价，有时指向相反的方向。
  practice_title: 研究与规划
  practice: >-
    这些研究最终要回到规划和政策上。多中心政策需要谨慎：它可能加强区域联系，也可能拉长通勤、加深核心与边缘的分化。公园配置要看供需是否匹配，人均面积只是其中一个维度。产业政策和地方营造需要相互配合，在中心城区和外围地区各有侧重。我们希望分清，哪些结论依赖地方情境，哪些可以为其他城市所用。
  pi_title: 课题组负责人
  pi_name: 伍杨屹
  pi_role: 副教授 · 城市规划系
  pi_bio: 伍杨屹从事城市与经济地理研究，关注城市空间变化、城市设施与资源获取的不平等。曾在美国犹他大学从事博士后研究，2022 年加入武汉大学城市设计学院。
  education_title: 教育经历
  education: ['2020 年，犹他大学，地理学博士', '2015 年，德克萨斯大学达拉斯分校，地理空间信息科学硕士', '2013 年，武汉大学，测绘工程学士']
  faculty: 学院个人主页
  cv: 完整简历
  project_intro: 以下为课题组主持与参与的科研项目。
  led: 主持项目
  collaborative: 参与及合作项目
  source_label: 项目信息来源：学院个人主页
  join_intro: 欢迎对城市与经济地理、城乡规划和空间不平等感兴趣的同学。人文地理、城乡规划、地理信息、计算机、经济学等不同背景，都能为这些问题提供新的切入角度。
  growth_title: 研究与成长
  contact_title: 联系方式
  contact: 请通过邮件介绍你的学习背景、研究兴趣，以及想深入探讨的问题，可以附上简历和相关研究成果。正式申请请按学校招生程序办理。
  recruitment_title: 招生安排
  recruitment_note: 招生专业、名额与申请安排，以武汉大学当年度招生通知为准。
  news_intro: 伍杨屹及合作者的论文发表与学术活动。
research_values:
  - word: Understand
    label_zh: 理解问题
    label_en: Context and questions
    description_zh: 从真实的城市现象出发，厘清问题的背景、对象与尺度。
    description_en: Start with real urban situations and clarify the context, people and spatial scales involved.
  - word: Think
    label_zh: 独立思考
    label_en: Independent thinking
    description_zh: 结合理论审视经验观察，提出有依据、可讨论的解释。
    description_en: Use theory to question observations and develop explanations that can be debated and tested.
  - word: Study
    label_zh: 严谨求知
    label_en: Rigorous inquiry
    description_zh: 用合适的方法分析可靠的证据，如实说明结论及其局限。
    description_en: Match methods to questions, work carefully with evidence and be clear about the limits of each finding.
  - word: Inspire
    label_zh: 相互启发
    label_en: Learning from one another
    description_zh: 在讨论、合作与反馈中拓展思路，也帮助彼此成长。
    description_en: Share ideas, collaborate and offer thoughtful feedback to help one another grow.
