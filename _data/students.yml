  quote_zh: 本科阶段就参与科研训练，让我获益良多：科研素养与科研思维的养成、对研究生学习与工作节奏的提前适应，都为继续深造打下了扎实的基础。课题组氛围轻松，沟通顺畅，遇到问题时老师总能及时给出建议和帮助，让我在科研与写作上稳步提升。
  quote_en: Taking part in research as an undergraduate benefited me greatly. It shaped my research skills and way of thinking, helped me adapt early to the pace of graduate study, and laid a solid foundation for further training. The group has a relaxed atmosphere and smooth communication; whenever I ran into problems, my advisor offered timely advice and help, and I steadily improved in both research and writing.
