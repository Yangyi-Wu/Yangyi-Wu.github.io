- id: transformation
  legacy_id: innovation
  title_zh: 城市转型
  title_en: Urban Transformation
  overview_zh: 研究制度变迁、资本流动与企业区位如何塑造地方发展，解释不同城市的转型路径，以及区域协作与地方竞争之间的关系。
  overview_en: How institutional change, capital flows and firm location shape local development, producing different urban trajectories and relationships between regional cooperation and local competition.
  home_question_zh: 城市如何适应经济与产业变化？
  home_question_en: How do cities respond to economic and industrial change?
  home_context_zh: >-
    从上海的生产性服务业到武汉的汽车产业，设施的作用比通常设想的更有选择性：地方创意活动依赖知识溢出和面对面交流，受设施影响很大；一般的企业集聚，受设施的影响则弱得多。都市区格局决定板块的竞争力，街区层面的设施组合决定具体区位——这两层逻辑需要分开对待。
  home_context_en: >-
    From Shanghai's producer services to Wuhan's automotive industry, amenities prove more selective than usually assumed: they strongly shape local creativity, which depends on knowledge spillovers and face-to-face contact, while doing much less for general firm agglomeration. Metropolitan patterns decide a district's competitiveness; neighborhood amenity mixes decide specific sites. The two logics call for separate treatment.
  focus_zh: ['区域化与制度变迁', '权力与资本的尺度重组', '企业区位与地方优势', '产业差异与城市发展路径']
  focus_en: ['Regionalization and institutional change', 'Rescaling power and capital', 'Firm location and place advantage', 'Sectoral differences and urban trajectories']
  question_zh: 制度与经济活动的变化，如何重塑地方发展的条件？
  question_en: How do institutional and economic changes reshape the conditions for local development?
  paragraphs_zh:
    - 大湾区研究把区域化与分权化、市场化、全球化联系起来，解释权力和资本的尺度重组如何改变地方政府策略。区域协作与地方竞争仍然并存；更强的空间连通性，也可能伴随更高的斑块密度（Land Use Policy, 2026）。
    - 地方优势还取决于城市内部的设施条件。武汉汽车产业研究区分都市区的竞争优势与具体区位的吸引力，将区域资源获取与地方营造联系起来。中心城区和外围地区的设施需求不同，产业政策需要回应这种差异（Applied Geography, 2025）。
    - 产业之间同样存在差别。上海生产性服务业研究发现，城市设施对地方创意活动的作用强于一般企业集聚；企业郊区化研究则显示，生产性服务业比制造业更敏感于社区特征。相似的空间变化，背后可能是不同的区位逻辑。
  paragraphs_en:
    - Research on the Greater Bay Area connects regionalization with decentralization, marketization and globalization to explain how rescaling power and capital changes local-government strategies. Regional cooperation coexists with local competition; greater spatial connectivity can also accompany higher patch density (Land Use Policy, 2026).
    - Place advantages also depend on amenities within cities. Our study of Wuhan's automotive industry distinguishes metropolitan competitive advantage from site-level attractiveness, connecting access to regional resources with placemaking. Central and peripheral areas have different amenity needs, with implications for industrial policy (Applied Geography, 2025).
    - These relationships vary by sector. In Shanghai's producer services, amenities matter more for local creativity than for general firm agglomeration. Research on suburbanization also finds producer services more responsive to neighborhood characteristics than manufacturing. Similar spatial changes can reflect different location strategies.
  papers:
    - path: /publication/2026-urban-form-politico-economic-transition-greater-bay-area
      title_zh: 区域化、权力与资本重组
      title_en: Regionalization, power and capital
    - path: /publication/2025-urban-amenities-knowledge-intensive-industry-locations
      title_zh: 产业区位的多尺度地方优势
      title_en: Place advantages across scales
    - path: /publication/2022-amenity-firm-agglomeration-local-creativity-producer-services-shanghai
      title_zh: 城市设施与地方创意
      title_en: Amenities and local creativity
    - path: /publication/2020-firm-suburbanization-urban-sprawl
      title_zh: 企业郊区化的产业差异
      title_en: Sectoral differences in suburbanization
- id: restructuring
  legacy_id: structure
  title_zh: 空间重构
  title_en: Spatial Restructuring
  overview_zh: 研究就业、居住与日常活动如何在城市内部重新分布。形态上的集聚、功能上的联系、居民实际的活动空间，是三层不同的结构。
  overview_en: How employment, housing and daily activities redistribute within cities. Morphological concentration, functional connection and residents' activity spaces are three distinct layers of structure.
  home_question_zh: 城市变化如何重新组织空间？
  home_question_en: How does urban change reorganize space?
  home_context_zh: >-
    多中心、住房子市场和居民出行，三条线索指向同一个提醒：地图上的中心数量，只是城市结构的一个侧面。人口、就业、房价和交通网络会识别出不同的中心；形态上分散的都市区，功能上可能仍由单一中心主导。
  home_context_en: >-
    Polycentricity, housing submarkets and travel behavior carry the same reminder: the number of centers on a map is only one facet of how a city works. Population, employment, housing prices and transport networks identify different centers; a morphologically dispersed region may still be functionally dominated by one downtown.
  focus_zh: ['都市空间结构', '多中心发展', '就业与居住空间关系', '城市功能重组']
  focus_en: ['Metropolitan spatial structure', 'Polycentric development', 'Jobs-housing relationships', 'Reorganization of urban functions']
  question_zh: 看似相近的空间格局，是否具有相同的功能联系与组织方式？
  question_en: Do similar spatial patterns imply similar functional connections and forms of urban organization?
  paragraphs_zh:
    - 多中心发展需要区分空间形态与功能联系。人口、就业和交通网络识别出的中心并不总是一致，中心数量也不能直接说明效率或公平。大湾区研究进一步显示，区域协作可以同时伴随连通性提升与空间破碎化。
    - 出行数据能检验空间结构如何实际运转。犹他州 Wasatch Front 都市区在形态上相当分散，但出行链仍以盐湖城市中心为功能核心；步行和骑行更多发生在中心内部，外围活动则更依赖汽车（Applied Geography, 2021）。
    - 住房子市场呈现另一种空间组织。我们依据住宅属性、可替代性与空间连接性识别相互联系的地方市场，而非直接沿用行政边界。这样划分的子市场提高了房价模型的解释力（Applied Spatial Analysis and Policy, 2020）。
  paragraphs_en:
    - Polycentric development requires a distinction between spatial form and functional connections. Population, employment and transport networks do not always identify the same centers; counting centers alone says little about efficiency or equity. Greater Bay Area evidence further shows that cooperation can accompany both connectivity and fragmentation.
    - Travel data reveal how these structures work in daily life. Utah's Wasatch Front is morphologically dispersed, yet trip chains remain functionally centered on downtown Salt Lake City. Walking and cycling are more common within centers, while activities outside them depend more on cars (Applied Geography, 2021).
    - Housing submarkets reveal another form of spatial organization. We identify connected local markets through housing attributes, substitutability and spatial connectivity rather than administrative boundaries. These submarkets improve the explanatory power of housing-price models (Applied Spatial Analysis and Policy, 2020).
  papers:
    - path: /publication/2026-urban-form-politico-economic-transition-greater-bay-area
      title_zh: 连通性与空间破碎化
      title_en: Connectivity and fragmentation
    - path: /publication/2025-polycentric-urban-development-china
      title_zh: 多中心的形态与功能
      title_en: Polycentric form and function
    - path: /publication/2020-spatial-heterogeneity-housing-prices-large-datasets
      title_zh: 住房子市场的空间识别
      title_en: Identifying housing submarkets
    - path: /publication/2021-trip-generation-trip-chains-polycentric-development-utah
      title_zh: 出行链与都市区日常联系
      title_en: Trip chains and metropolitan connections
- id: inequality
  legacy_id: equity
  title_zh: 空间不平等
  title_en: Spatial Inequality
  overview_zh: 研究不同地方、不同群体获取城市资源的差异。我们既关注资源在哪里，也关注谁能使用、如何使用、谁的需要被满足。
  overview_en: How access to urban resources differs across places and social groups. We ask both where resources are located and who can use them, how they are used, and whose needs are met.
  home_question_zh: 城市发展的机会如何在空间中分布？
  home_question_en: How are the opportunities created by urban development distributed across space?
  home_context_zh: >-
    公园、住房和区域差距的研究，关注资源条件如何转化为实际机会。客观可达性较差的近郊，居民感知可能更乐观；不平等指数下降的省份，核心与边缘的格局可能依然如故。
  home_context_en: >-
    Research on parks, housing and regional disparities asks how resource conditions translate into opportunities. Peri-urban residents may perceive access more optimistically despite poorer measured accessibility; a province with falling inequality indices may retain its core-periphery structure.
  focus_zh: ['公共资源可达性', '城市设施公平', '住房市场分化', '社会空间差异']
  focus_en: ['Access to public resources', 'Equity in urban amenities', 'Housing market differentiation', 'Socio-spatial disparities']
  question_zh: 资源配置的改善，为什么未必使不同群体同等受益？
  question_en: Why do improvements in resource provision not necessarily benefit social groups equally?
  paragraphs_zh:
    - 公园公平需要把资源条件与居民体验放在一起理解。盐湖城南部近郊客观可达性较差，居民评价却更乐观；西部近郊与中心城区可达性相近，设施改善需求仍有差异。武汉研究则结合公园质量与服务能力，分析供给能否回应不同人群的需求。
    - 住房占有方式也是机会分化的一个维度。上海租售比较发现，买方相对更重视服务设施，租方相对更重视就业机会。两类人群面对不同的制度约束和区位选择，租金与售价因而不能沿用同一套市场解释（Journal of Urban Affairs, 2025）。
    - 区域尺度上，总体差距收窄也可能伴随地方等级的延续。江苏研究发现，不平等指数下降可以与空间极化、地方流动性不足并存。理解地区发展机会，需要同时分析差距大小和地方在区域结构中的位置（Applied Geography, 2020）。
  paragraphs_en:
    - Park equity connects resource conditions with residents' experience. Southern peri-urban Salt Lake City residents report more optimistic perceptions despite poorer measured access. Western communities have access similar to the center but different infrastructure needs. Research in Wuhan combines park quality and service capacity to assess provision for different population groups.
    - Housing tenure is another dimension of unequal opportunity. Shanghai's rent-sale comparison finds buyers placing relatively greater emphasis on service amenities and renters on employment. Different institutional constraints and location choices mean that rents and sale prices require distinct explanations (Journal of Urban Affairs, 2025).
    - At the regional scale, narrowing disparities can coexist with persistent hierarchies. Research on Jiangsu finds falling inequality indices alongside spatial polarization and limited place mobility. Understanding development opportunities requires attention both to the size of disparities and to places' positions within the regional structure (Applied Geography, 2020).
  papers:
    - path: /publication/2025-park-use-covid-peri-urban
      title_zh: 公园可达性与居民体验
      title_en: Park access and residents' experience
    - path: /publication/2025-urban-park-equity-wuhan
      title_zh: 公园供给与差异化需求
      title_en: Park provision and differentiated needs
    - path: /publication/2025-institutions-urban-space-residential-markets-shanghai
      title_zh: 住房租售与城市机会
      title_en: Housing tenure and urban opportunities
    - path: /publication/2020-regional-inequality-spatial-polarization-place-mobility-jiangsu
      title_zh: 区域差距与地方流动性
      title_en: Regional inequality and place mobility
