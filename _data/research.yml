    - /publication/2026-urban-form-politico-economic-transition-greater-bay-area
    - /publication/2025-urban-amenities-knowledge-intensive-industry-locations
    - /publication/2022-amenity-firm-agglomeration-local-creativity-producer-services-shanghai
    - /publication/2020-firm-suburbanization-urban-sprawl
- id: restructuring
  legacy_id: structure
  title_zh: 空间重构
  title_en: Spatial Restructuring
  overview_zh: 研究就业、居住与日常活动如何在城市内部重新分布。形态上的集聚、功能上的联系、居民实际的活动空间，是三层不同的结构。
  overview_en: How employment, housing and daily activities redistribute within cities. Morphological concentration, functional connection and residents' activity spaces are three distinct layers of structure.
  home_question_zh: 城市变化如何重新组织空间？
  home_question_en: How does urban change reorganize space?
  home_context_zh: >-
    多中心、住房子市场和居民出行，三条线索指向同一个提醒：地图上的中心数量，只是城市结构的一个侧面。人口、就业、房价和交通网络会识别出不同的中心；形态上分散的都市区，功能上可能仍由单一中心主导。
  home_context_en: >-
    Polycentricity, housing submarkets and travel behavior carry the same reminder: the number of centers on a map is only one facet of how a city works. Population, employment, housing prices and transport networks identify different centers; a morphologically dispersed region may still be functionally dominated by one downtown.
  focus_zh: ['都市空间结构', '多中心发展', '就业与居住空间关系', '城市功能重组']
  focus_en: ['Metropolitan spatial structure', 'Polycentric development', 'Jobs-housing relationships', 'Reorganization of urban functions']
  question_zh: 看似相近的空间格局，是否具有相同的功能联系与组织方式？
  question_en: Do similar spatial patterns imply similar functional connections and forms of urban organization?
  text_zh: >-
    地图上的中心数量，只是城市结构的一个侧面。同样是「多中心」，含义可能完全不同：人口、就业、房价、设施和交通网络会识别出不同的中心，用单一指标判断城市结构，容易误判（Chinese Geographical Science, 2025）。形态和功能也必须分开验证：犹他州 Wasatch Front 都市区在形态上已相当分散，但出行链数据显示，日常活动在功能上仍由盐湖城市中心主导——中心内部，步行和骑行的出行链较为常见；中心之外，汽车仍占绝对主导（Applied Geography, 2021）。住房市场的空间结构另有识别方法：我们用属性相似性、可替代性和空间连接性代替行政边界，把住房子市场看作相互连接的地方市场——据此识别的市场结构，能切实提高房价模型的解释力（Applied Spatial Analysis and Policy, 2020）。
  text_en: >-
    The number of centers on a map is only one facet of urban structure. "Polycentricity" can mean entirely different things: population, employment, housing prices, amenities and transport networks each identify different centers, and single-indicator judgments are easily misleading (Chinese Geographical Science, 2025). Form and function must also be verified separately. Utah's Wasatch Front is morphologically dispersed, yet trip-chain data show that daily life remains functionally dominated by downtown Salt Lake City — walking and cycling trip chains are common inside centers, while cars dominate elsewhere (Applied Geography, 2021). Housing markets require a different identification strategy: we replace administrative boundaries with attribute similarity, substitutability and spatial connectivity, treating submarkets as connected local markets; the resulting structure measurably improves hedonic models (Applied Spatial Analysis and Policy, 2020).
  papers:
    - /publication/2026-urban-form-politico-economic-transition-greater-bay-area
    - /publication/2025-polycentric-urban-development-china
    - /publication/2020-spatial-heterogeneity-housing-prices-large-datasets
    - /publication/2021-trip-generation-trip-chains-polycentric-development-utah
- id: inequality
  legacy_id: equity
  title_zh: 空间不平等
  title_en: Spatial Inequality
  overview_zh: 研究不同地方、不同群体获取城市资源的差异。我们既关注资源在哪里，也关注谁能使用、如何使用、谁的需要被满足。
  overview_en: How access to urban resources differs across places and social groups. We ask both where resources are located and who can use them, how they are used, and whose needs are met.
  home_question_zh: 城市发展的机会如何在空间中分布？
  home_question_en: How are the opportunities created by urban development distributed across space?
  home_context_zh: >-
    公园、住房和区域差距，三条线索反复呈现同一种错位：资源分布是一回事，机会真正落在谁身上是另一回事。可达性指标乐观的近郊，居民体验可能相反；不平等指数下降的省份，核心与边缘的格局可能依然如故。
  home_context_en: >-
    Parks, housing and regional disparities repeatedly display the same mismatch: the distribution of resources and the distribution of opportunities are two different things. Peri-urban areas that score well on accessibility may be experienced otherwise by residents; a province with falling inequality indices may keep its core–periphery structure intact.
  focus_zh: ['公共资源可达性', '城市设施公平', '住房市场分化', '社会空间差异']
  focus_en: ['Access to public resources', 'Equity in urban amenities', 'Housing market differentiation', 'Socio-spatial disparities']
  question_zh: 资源配置的改善，为什么未必使不同群体同等受益？
  question_en: Why do improvements in resource provision not necessarily benefit social groups equally?
  text_zh: >-
    公平研究首先要把两件事分开：资源分布在哪里，机会真正落在谁身上。公园研究反复发现二者错位：盐湖城的南部近郊，居民对公园可达性的评价比空间指标显示的更乐观，而西部社区的质量短板在疫情期间进一步放大——城区与近郊的对比说明，公平评价要同时看设施分布、居民体验和改善需求（Landscape and Urban Planning, 2025）。武汉的评估换了角度：不看单一的可达性指标，而是把公园质量和供给能力结合起来，看供给是否跟得上不同人群的需求——老年人群体尤其值得关注（Sustainability, 2025）。住房市场的分化遵循另一套逻辑：上海的租售比较显示，租房者对就业机会、社会服务和通勤便利更敏感，买房者更看重产权价值和投资属性，产权本身正在成为城市不平等的新轴线（Journal of Urban Affairs, 2025）。区域尺度上，江苏的案例提醒我们：不平等指数下降，可以和持续的空间极化、地方流动性不足并存——强势核心的累积优势，会固化核心与边缘的等级结构（Applied Geography, 2020）。
  text_en: >-
    Equity research starts by separating two things: where resources are located, and where opportunities actually land. Park studies repeatedly find the two misaligned. In Salt Lake City, southern peri-urban residents rated park access more positively than spatial metrics suggest, while western communities' quality deficits deepened during the pandemic — the urban–peri-urban contrast shows why equity assessment must combine facility distribution with lived experience and stated needs (Landscape and Urban Planning, 2025). The Wuhan evaluation adopts a complementary perspective: rather than a single accessibility metric, it asks whether quality-adjusted park supply matches the differentiated needs of the population, with older adults as the most vulnerable group (Sustainability, 2025). Housing markets divide along different lines: Shanghai's sale–rental comparison shows renters respond more to jobs, social services and mobility, while buyers weight ownership value and investment conditions — tenure itself is becoming a new axis of urban inequality (Journal of Urban Affairs, 2025). At the regional scale, Jiangsu warns that falling inequality indices can coexist with persistent spatial polarization and low place mobility, as accumulated advantages in strong cores lock in the core–periphery hierarchy (Applied Geography, 2020).
