- id: transformation
  legacy_id: innovation
  title_zh: 城市转型
  title_en: Urban Transformation
  overview_zh: 研究经济转型、企业区位与城市设施如何共同塑造地方发展——以及为什么相似的转型，在不同城市会走出不同的路径。
  overview_en: How economic change, firm location and urban amenities jointly shape local development — and why similar transformations follow different paths in different cities.
  home_question_zh: 城市如何适应经济与产业变化？
  home_question_en: How do cities respond to economic and industrial change?
  home_context_zh: >-
    从上海的生产性服务业到武汉的汽车产业，设施的作用比通常设想的更有选择性：地方创意活动依赖知识溢出和面对面交流，受设施影响很大；一般的企业集聚，受设施的影响则弱得多。都市区格局决定板块的竞争力，街区层面的设施组合决定具体区位——这两层逻辑需要分开对待。
  home_context_en: >-
    From Shanghai's producer services to Wuhan's automotive industry, amenities prove more selective than usually assumed: they strongly shape local creativity, which depends on knowledge spillovers and face-to-face contact, while doing much less for general firm agglomeration. Metropolitan patterns decide a district's competitiveness; neighborhood amenity mixes decide specific sites. The two logics call for separate treatment.
  focus_zh: ['产业转型与企业区位', '城市竞争优势', '经济活动的空间集聚', '城市发展路径']
  focus_en: ['Industrial change and firm location', 'Urban competitive advantages', 'Spatial agglomeration', 'Urban development paths']
  question_zh: 经济活动的区位选择，如何改变城市发展的动力与地方优势？
  question_en: How do location choices reshape the drivers of urban development and the advantages of places?
  text_zh: >-
    产业为什么选择特定区位？我们从都市区和具体区位两个空间尺度展开分析。在都市区尺度上，上海的研究显示，设施对不同类型经济活动的吸引力并不相同：对一般的生产性服务业企业，设施的作用有限；但「地方创意」活动依赖知识溢出和面对面交流，对共址、可达性和高密度设施簇的反应要强得多（Cities, 2022）。同一尺度下的企业郊区化研究也发现产业差异：生产性服务业比制造业更在意社区特征；若把就业郊区化视为单一的去中心化过程，这些差异就会被遮蔽（The Professional Geographer, 2020）。在具体区位尺度上，武汉汽车产业的研究发现：都市区的设施格局决定各板块的竞争优势，具体区位能否吸引企业集聚，取决于地方设施的数量和多样性，其中基础设施和公共服务的作用最稳定（Applied Geography, 2025）。政策含义很明确：中心城区和外围地区的设施配置重点应当不同，产业政策需要与地方营造相互配合。
  text_en: >-
    Why do firms choose particular locations? We examine this question at two spatial scales: metropolitan areas and individual sites. At the metropolitan scale, research on Shanghai shows that amenities do not attract all economic activity alike: they matter only modestly for the average producer-services firm, whereas "local creativity", sustained by knowledge spillovers and face-to-face contact, responds far more strongly to co-location, accessibility and dense amenity clusters (Cities, 2022). Research on firm suburbanization at the same scale also reveals sectoral differences: producer services respond more strongly than manufacturing to neighborhood characteristics, and reading suburban job growth as simple decentralization obscures these differences (The Professional Geographer, 2020). At the site scale, a study of Wuhan's automotive industry finds that metropolitan amenity patterns set each district's competitive advantage, while the clustering appeal of a specific location depends on the quantity and diversity of local amenities, with infrastructure and public services the most stable factors (Applied Geography, 2025). The policy implication is clear: central and peripheral districts need different amenity priorities, and industrial policy works best in concert with placemaking.
